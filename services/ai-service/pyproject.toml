[project]
name = "glitchygames-ai-service"
version = "0.1.0"
description = "The local AI service GlitchyGames games talk to: REST and a WebSocket over local models"
requires-python = ">=3.14,<4.0"
# Its own project, outside the engine's uv workspace, sharing no code with the engine: games reach it
# only over a socket, and it ships in its own sidecar Python (plans/lucid-circuit.md, section 4)
dependencies = ["fastapi", "httpx2", "pydantic", "uvicorn", "websockets"]

[dependency-groups]
dev = ["pytest", "pytest-cov", "pytest-mock>=3.17.0", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glitchygames_ai_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=glitchygames_ai_service --cov-report=term-missing --cov-fail-under=100"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001", "D203", "D213", "Q000", "Q003"]

[tool.ruff.lint.per-file-ignores]
# ARG001: a pytest fixture named only for what it sets up looks like an unused argument
"tests/**" = ["D", "S101", "PLR2004", "ANN", "ARG001"]

[tool.ruff.lint.pydocstyle]
convention = "google"
