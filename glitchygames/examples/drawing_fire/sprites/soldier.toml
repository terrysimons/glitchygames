[sprite]
name = "soldier"
description = "A pencil-drawn stick-figure soldier, drawn in the Pencil Platoon livery, which the livery swatches recolour for any other army"

[colors]
"█" = { red = 255, green = 0, blue = 255 }
"o" = { red = 58, green = 58, blue = 64 }
"k" = { red = 224, green = 190, blue = 160 }
"h" = { red = 242, green = 194, blue = 48 }
"H" = { red = 161, green = 129, blue = 32 }
"u" = { red = 214, green = 168, blue = 40 }
"U" = { red = 143, green = 112, blue = 27 }

# The livery swatches: each part's first colour is its base, the rest are shades that keep their ratio
# (each shade is 2/3 of its base, rounded to whole channel values)
[swatches.livery.helmet]
colors = ["h", "H"]
role = "primary"

[swatches.livery.uniform]
colors = ["u", "U"]
role = "secondary"

