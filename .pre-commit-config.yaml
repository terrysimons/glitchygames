# pre-commit install installs the pre-push stage (format, lint, types, security, complexity, the
# suite, compare-drivers); .envrc runs it. No hook measures the golden replays into the repository
# any more: the owner, 2026-11-22, stopped committing replay-ledger rows (too many files in git;
# they move to S3, plans/future-work.md). nox -s measure-staged and measure-on-raspberry-pi
# still measure by hand
default_install_hook_types: [pre-push]
# A commit or push that changes only Markdown (BUGS.md, docs, plans) runs no hook: no check and
# no measurement (the owner, 2026-11-14). Each hook sees only the other files, so pre-commit
# skips it when there are none; a hook with always_run would ignore this, so none has it.
# CI still lints the docs and runs the suite on every pull request
exclude: '\.md$'

repos:
- repo: local
  hooks:
    - id: format
      name: format (code, toml)
      language: system
      entry: uv run --extra dev nox -s format
      pass_filenames: false
      stages: [pre-push]

    - id: lint
      name: lint (code, docs, yaml, toml, deps, dead code)
      language: system
      entry: uv run --extra dev nox -s lint
      pass_filenames: false
      stages: [pre-push]

    - id: lint-ci-config
      name: lint-ci-config (circleci)
      language: system
      entry: uv run --extra dev nox -s lint-ci-config
      pass_filenames: false
      stages: [pre-push]

    - id: static-analysis
      name: static-analysis (basedpyright, ty)
      language: system
      entry: uv run --extra dev nox -s static-analysis
      pass_filenames: false
      stages: [pre-push]

    # bandit, then the syft SBOM (docs/sbom.cyclonedx.json; a regenerated SBOM that differs from
    # the committed one fails), grype's CVE scan and the license check. syft and grype come from
    # .envrc (Homebrew); without them the session warns and runs bandit alone
    - id: security-scan
      name: security-scan (bandit, syft SBOM, grype CVEs, licenses)
      language: system
      entry: uv run --extra dev nox -s security-scan
      pass_filenames: false
      stages: [pre-push]

    - id: code-complexity
      name: code-complexity (wily diff)
      language: system
      entry: uv run --extra dev nox -s code-complexity
      pass_filenames: false
      stages: [pre-push]

    # The suite in a shuffled order (pytest-randomly, a new seed each push), on Python 3.15, in
    # its own environment whatever the .venv's Python: order-dependent
    # tests surface here, where CI's fixed order would hide them. A failure prints its seed and
    # the command that replays it; SKIP=test-random git push ... skips it
    - id: test-random
      name: test-random (the suite, shuffled, on 3.15)
      language: system
      entry: uv run --extra dev nox -s test-random
      pass_filenames: false
      stages: [pre-push]

    # The suite on the dummy driver (twice: frames that vary between those runs are not counted)
    # and on every native driver here, each its own run: a test presenting different frames on
    # a native driver than on dummy is a driver dependence (BUGS.md #254) and stops the push.
    # The report and difference images: test-results/driver-comparison/nox/matrix.md.
    # SKIP=compare-drivers git push ... skips it
    - id: compare-drivers
      name: compare-drivers (dummy vs the native driver, each its own run)
      language: system
      entry: uv run --extra dev nox -s compare-drivers -- --drivers native --fail-on-difference --workers auto --skip-when-frames-cannot-change
      pass_filenames: false
      stages: [pre-push]
