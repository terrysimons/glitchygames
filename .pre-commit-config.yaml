# pre-commit install installs both stages: pre-push (format, lint, types, security, complexity)
# and pre-commit (replay-metrics: a commit carries the measurements of its code); .envrc runs it
default_install_hook_types: [pre-commit, pre-push]

repos:
- repo: local
  hooks:
    - id: format
      name: format (code, toml, markdown)
      language: system
      entry: uv run --extra dev nox -s format
      pass_filenames: false
      stages: [pre-push]

    - id: lint
      name: lint (code, docs, yaml, toml, deps, dead code)
      language: system
      entry: uv run --extra dev nox -s lint
      pass_filenames: false
      stages: [pre-push]

    - id: lint-ci-config
      name: lint-ci-config (circleci)
      language: system
      entry: uv run --extra dev nox -s lint-ci-config
      pass_filenames: false
      stages: [pre-push]

    - id: static-analysis
      name: static-analysis (basedpyright, ty)
      language: system
      entry: uv run --extra dev nox -s static-analysis
      pass_filenames: false
      stages: [pre-push]

    # bandit, then the syft SBOM (docs/sbom.cyclonedx.json; a regenerated SBOM that differs from
    # the committed one fails), grype's CVE scan and the license check. syft and grype come from
    # .envrc (Homebrew); without them the session warns and runs bandit alone
    - id: security-scan
      name: security-scan (bandit, syft SBOM, grype CVEs, licenses)
      language: system
      entry: uv run --extra dev nox -s security-scan
      pass_filenames: false
      stages: [pre-push]

    - id: code-complexity
      name: code-complexity (wily diff)
      language: system
      entry: uv run --extra dev nox -s code-complexity
      pass_filenames: false
      stages: [pre-push]

    # Measures the golden replays on the code being committed when it can change them, and
    # stages the rows (quality/replay-ledger/) into the same commit
    # (scripts/measure_staged_replays.py); SKIP=replay-metrics git commit ... skips it
    - id: replay-metrics
      name: replay-metrics (measure the staged code)
      language: system
      entry: uv run python -m scripts.measure_staged_replays
      pass_filenames: false
      always_run: true
      stages: [pre-commit]
