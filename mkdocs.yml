site_name: GlitchyGames
# Where GitHub Pages serves the gh-pages branch (nox -s docs-deploy)
site_url: https://terrysimons.github.io/glitchygames/
repo_url: https://github.com/terrysimons/glitchygames
repo_name: glitchygames

nav:
  - GlitchyGames Getting Started: "index.md"
  - glitchygames API Reference:
    - "glitchygames/index.md"
    - glitchygames.api: "glitchygames/api/index.md"
    - glitchygames.audio: "glitchygames/audio/index.md"
    - glitchygames.collision: "glitchygames/collision/index.md"
    - glitchygames.color: "glitchygames/color/index.md"
    - glitchygames.effects: "glitchygames/effects/index.md"
    - glitchygames.engine: "glitchygames/engine/index.md"
    - glitchygames.events: "glitchygames/events/index.md"
    - glitchygames.examples: "glitchygames/examples/index.md"
    - glitchygames.font: "glitchygames/fonts/index.md"
    - glitchygames.game_objects: "glitchygames/game_objects/index.md"
    - glitchygames.input: "glitchygames/input/index.md"
    - glitchygames.interfaces: "glitchygames/interfaces/index.md"
    - glitchygames.movement: "glitchygames/movement/index.md"
    - glitchygames.physics: "glitchygames/physics/index.md"
    - glitchygames.pixels: "glitchygames/pixels/index.md"
    - glitchygames.replay: "glitchygames/replay/index.md"
    - glitchygames.scenes: "glitchygames/scenes/index.md"
    - glitchygames.sprites: "glitchygames/sprites/index.md"
    - glitchygames.state: "glitchygames/state/index.md"
    - glitchygames.templates: "glitchygames/templates/index.md"
    - glitchygames.tools: "glitchygames/tools/index.md"
    - glitchygames.transitions: "glitchygames/transitions/index.md"
    - glitchygames.ui: "glitchygames/ui/index.md"
  - Documentation:
    - Bitmappy Architecture: "architecture/bitmappy.md"
    - Event System: "architecture/event_system.md"
    - Argument System: "architecture/argument_system.md"
    - Gameplay Recording and Replay: "architecture/gameplay_replay.md"
    - Multi-Controller System: "multi_controller_system.md"
    - Code Complexity: "quality/complexity.md"
    - Replay Performance: "quality/performance.md"
    - Driver Comparison: "quality/driver_comparison.md"
    - Galimore Survey: "galimore.md"

extra_javascript:
  - https://unpkg.com/mermaid/dist/mermaid.min.js
  - js/mermaid-init.js

# The complexity and performance graphs' snippets, which quality/complexity.md and
# quality/performance.md include (pymdownx.snippets), are not pages of their own
# (scripts/generate_complexity_graphs.py, scripts/generate_performance_graphs.py)
exclude_docs: |
  /quality/graphs/*.md
  /quality/metrics/*.md

# Every build (build, serve, gh-deploy) first generates the complexity graphs when they are
# missing or were made from another commit, then the performance graphs (scripts/mkdocs_hooks.py)
hooks:
  - scripts/mkdocs_hooks.py

validation:
  omitted_files: warn
  not_found: warn
  absolute_links: warn

theme:
  name: readthedocs
  highlightjs: true
  include_homepage_in_sidebar: true
  prev_next_buttons_location: both
  navigation_depth: 4
  collapse_navigation: false
  titles_only: true
  sticky_navigation: true
  features:
    - navigation.expand
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.prefetch
    - navigation.prune
    - navigation.quick
    - navigation.quick.progress
    - navigation.scroll
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - toc.follow
    - toc.integrate

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      toc_depth: 3
      permalink: "#"
      separator: "-"
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.betterem
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.tasklist
  - pymdownx.tilde
  - pymdownx.emoji
  - pymdownx.keys
  - pymdownx.caret
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets
  - pymdownx.details

plugins:
  - autorefs
  - macros
  - search
  - section-index
  - mkdocstrings:
      handlers:
        python:
          paths: [glitchygames]
          options:
            show_source: true
            # allow_inspection: no
            # show_bases: yes
            # show_source: no
            # show_root_heading: yes
            # preload_modules: no
            # allow_inspection: yes
            # show_bases: yes
            # heading_level: 2
            # show_root_heading: yes
            # show_root_toc_entry: yes
            # show_root_full_path: yes
            # show_root_members_full_path: yes
            # show_object_full_path: yes
            # show_category_heading: yes
            # show_symbol_type_heading: yes
            # show_symbol_type_toc: yes
            # inherited_members: yes
            # members: yes
            # members_order: source
            # group_by_category: yes
            # show_submodules: yes
            # summary: yes
            # docstring_style: "google"
            # docstring_section_style: table
            # show_if_no_docstring: yes
            # show_docstring_attributes: yes
            # show_docstring_functions: yes
            # show_docstring_classes: yes
            # show_docstring_modules: yes
            # show_docstring_description: yes
            # show_docstring_examples: yes
            # show_docstring_other_parameters: yes
            # show_docstring_parameters: yes
            # show_docstring_raises: yes
            # show_docstring_receives: yes
            # show_docstring_returns: yes
            # show_docstring_yields: yes
            # annotations_path: brief
            # line_length: 100
            # show_signature: yes
            # show_signature_annotations: yes
            # signature_crossrefs: yes
            # separate_signature: yes
            # unwrap_annotated: no
