<!DOCTYPE html>
<!--
  GlitchyGames in the browser: the page template that `python -m scripts.build_browser_bundle` renders for one
  game ($title, $pyscript_release, $tab_icon_link, $saved_scheme_script, $docs_color_styles: the
  docs site's light and dark colors, as on the play/ index; "$$" in this comment keeps a name from
  being filled in). PyScript loads Pyodide and GlitchyGames' own pygame-ce wheel
  (pyscript.toml), then browser/boot.py runs the game on this canvas.
  A plain main-thread <script type="py">, not PyScript's py-game: py-game always loads Pyodide's
  own pygame-ce first, which ours would then be unpacked over.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brave Adventurer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%23000'/><text x='8' y='12.5' font-size='12' font-family='monospace' font-weight='bold' text-anchor='middle' fill='%239cf'>G</text></svg>">
  <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
  <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
  <script>
    try {
      const key = new URL('../../', location).pathname + '.__palette';
      const saved = JSON.parse(localStorage.getItem(key));
      if (saved && saved.color && saved.color.scheme) {
        const root = document.documentElement;
        root.setAttribute('data-md-color-scheme', saved.color.scheme);
      }
    } catch (error) {
      // No storage (a private window, blocked site data): the system setting decides
    }
  </script>
  <style>
    :root, :root[data-md-color-scheme=default] { color-scheme: light;
      --page-background: #fff; --page-text: #000000de;
      --page-link: #4051b5;
      --page-header-background: #4051b5;
      --page-header-text: #fff; }
    @media (prefers-color-scheme: dark) {
    :root:not([data-md-color-scheme=default]) { color-scheme: dark;
      --page-background: hsl(225deg 15% 14%); --page-text: hsl(225deg 15% 90% / 82%);
      --page-link: #5488e8;
      --page-header-background: #4051b5;
      --page-header-text: #fff; }
    }
    :root[data-md-color-scheme=slate] { color-scheme: dark;
      --page-background: hsl(225deg 15% 14%); --page-text: hsl(225deg 15% 90% / 82%);
      --page-link: #5488e8;
      --page-header-background: #4051b5;
      --page-header-text: #fff; }
    /* No page selection: the game's own Ctrl/Cmd+A (select all in a text box) also reaches the
       page, since SDL leaves a key's default action alone while text input is on */
    body {
      margin: 0; background: var(--page-background); color: var(--page-text);
      font-family: system-ui, sans-serif;
      user-select: none; -webkit-user-select: none;
    }
    main { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px; }
    #frame { position: relative; }
    /* The game's pixels stay sharp when the browser scales the canvas (high-DPI displays) */
    #canvas { display: block; image-rendering: pixelated; max-width: 100vw; }
    #start-overlay {
      position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.6); color: #fff; font-size: 1.5rem; cursor: pointer;
    }
    #status { font-size: 0.9rem; opacity: 0.7; }

    /* Touch controls (touch_controls.js; shown on touch devices with body.touch). Portrait:
       below the game; landscape: over its bottom corners, with the game as tall as the screen.
       Below the game they take the page's text color; over it, white */
    :root {
      --touch-button-size: 64px;
      --touch-border: color-mix(in srgb, var(--page-text) 35%, transparent);
      --touch-fill: color-mix(in srgb, var(--page-text) 12%, transparent);
      --touch-pressed: color-mix(in srgb, var(--page-text) 40%, transparent);
      --touch-text: var(--page-text);
    }
    #touch-controls { display: none; }
    body.touch { touch-action: manipulation; }
    body.touch #touch-controls {
      display: flex; justify-content: space-between; align-items: flex-end; gap: 12px;
      width: 100%; max-width: 800px; box-sizing: border-box; padding: 4px;
      touch-action: none; -webkit-touch-callout: none;
    }
    .touch-cluster { display: grid; gap: 10px; }
    .touch-button, .touch-gap { width: var(--touch-button-size); height: var(--touch-button-size); }
    .touch-button {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      border-radius: 18px; border: 2px solid var(--touch-border);
      background: var(--touch-fill); color: var(--touch-text); font-size: 1.35rem; line-height: 1.1;
    }
    .touch-button.pressed { background: var(--touch-pressed); }
    .touch-key-name { font-size: 0.7rem; opacity: 0.75; }
    @media (orientation: landscape) {
      body.touch main { padding: 0; }
      body.touch #canvas { width: auto; height: auto; max-height: 100vh; }
      body.touch #touch-controls {
        position: fixed; left: 0; right: 0; bottom: 0; max-width: none; padding: 12px;
        pointer-events: none;
        --touch-border: rgba(255, 255, 255, 0.35); --touch-fill: rgba(255, 255, 255, 0.08);
        --touch-pressed: rgba(255, 255, 255, 0.4); --touch-text: #eee;
      }
      body.touch .touch-cluster { pointer-events: auto; }
    }
  </style>
</head>
<body>
  <main>
    <div id="frame">
      <canvas id="canvas" width="800" height="480"></canvas>
      <div id="start-overlay">Click to play</div>
    </div>
    <p id="status">Loading Python and pygame-ce...</p>
  </main>
  <script type="py" src="boot.py" config="pyscript.toml"></script>
  <script src="touch_controls.js"></script>
</body>
</html>
