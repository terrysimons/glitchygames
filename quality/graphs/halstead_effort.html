nables SYSWMEVENT (SDL disables it; pygame-ce 2.5.8's get_blocked also\n  misreports it, so snapshot\u002frestores enabled it too). Blocked by default\n  now (events.allow_every_event_type); a game opts in with\n  Scene.NATIVE_WINDOW_MESSAGES = True and receives on_sys_wm_event, recorded\n  and replayed like any event (the user's decision).\n- #195: the x11-macos worker crash (GLXBadContext, then a SkyLight segfault)\n  came from OpenGL in the x11 SDL build loading XQuartz's libGL\u002fXplugin;\n  build_sdl_x11 now passes --disable-video-opengl.\n- Tests: windows at least 72 px wide (XQuartz's minimum), real pointer\n  motion and focus events tolerated where an X server is attached; the\n  container gets curl and runs with --init.\n- Logged: #191 (a replay never applies the recorded screen size), #192\n  (compare-drivers reports agreement when no test ran), #196 (a replay\n  diverging under load on x11-linux only).\n\nCo-Authored-By: Claude Opus 5.5 (1M context) \u003cnoreply@anthropic.com\u003e\n"],"x":["2026-10-23T19:01:27","2026-10-23T10:04:32"],"xcalendar":"gregorian","y":[10349.523821860104,7824.6438318876935],"type":"scatter"},{"hoveron":"points+fills","ids":["b7d5bd57e87272d7dad1c2b0894c0c5e3368488d","f36f3ea6b73598a10d2567f552066a1ff2768d9b","b85fd61daaf693aec77c02a7bd15a79bc6749108","6693049987f4480c4e4833c75cc11b4dc7ee0fe8","eb56077a024ab5674225c6a9e033bb2571b06858","3a4f8416082c9426a783a74d8ebd26c572f30a2b","42fb9fe9c7d6e68f736037fe5b7f2692744fd8f9","2f044063c65f274ee559da5ae5ab849cd5cf90ce","a6ff394754e0fbfe0d4b6d3b981f3218f0df0079","57d3af7d15ceb95535424a70b36a153e8f5bbce9","8cbd5dc632358ab7d7b661baf2e78def535881ee","68cea4299d268d831208af79724c226e7ad1e064","10b0782d6855d1e4404c0ec5eac5700153413c9f","5e5472316e1d2ffefbf9b43dcc406515f7d5b2e2","195f8bceb784d25eb2c268958aafa8c4f59bbeed","7a0f27bd5ff21e55e066251cc41d0585598e3edf","e7949a94fc2b8b944a907c488068d6ae2eca12f8","7bf1d4d97fa0cc234abdea75c0307c4025c816ce","1fbb71666100ff88d2dc175e652990a89de7f18d" 5f823e","29b99c45f9d80e715174541159887763a4a5cf44"],"marker":{"color":[0,1,2,3,4],"size":0},"mode":"lines+markers","name":"glitchygames\u002fscenes\u002fscene.py","text":["Terry Simons \u003cbr\u003elint-cves: audit every extra; ignore only unfixable CVEs, each documented\n\nfilelock 3.32.7 (3 CVEs, fixed in 4.2.1) is capped below 4 by safety 3.8.1, the\nnewest; google-cloud-aiplatform 1.71.1 (CVE-2026-2473) is pinned by vertexai 1.71.1,\nthe newest, which aisuite needs. The pygments ignore (CVE-2026-4539) was stale:\npygments 2.21.0 is past the affected 2.19.2. The session failed on filelock before.\n\nCo-Authored-By: Claude Opus 5.5 (1M context) \u003cnoreply@anthropic.com\u003e\n","Terry Simons \u003cbr\u003eExample games under coverage and up to standard; exact coverage gate\n\nThe *\u002fexamples\u002f* coverage omit (there since #55) is removed, at the user's\nrequest, and the games brought to 100% line and branch coverage with\nreal-pygame tests (only the joystick demo, rewritten in the next commit,\nwas left for later):\n- Brave Adventurer (both editions), Clockwork Keep, PaddleSlap, dt_demo,\n  text_input_demo; redundant guards removed; main() of each game replays its\n  golden recording in-process (tests\u002fexamples\u002fdemo_runs.py for the demos).\n- dt_demo uses the bundled Vera font (#173.3); text_input_demo quit on the\n  key press instead of the release and its submit handler could never run.\n- Deleted (user's call): the dead INI\u002fIPython notebook script\n  examples\u002fresources\u002fload_sprite_test.py (bokeh kept: deptry DEP002 ignore\n  with the reason) and PaddleSlap's never-constructed TextSprite\u002fTextBox.\n- PaddleSlap honours --ball-spawn-mode: wall_only \u002f ball_only \u002f frequent now\n  spawn on the triggers they name (nothing read those flags); the default\n  mode and the recordings are unchanged.\n- Clockwork Keep: the unused MovingGear now carries the climber up the last\n  stretch of the Clock Face (floor 2; no golden recording reaches it).\n- Coverage precision 2: fail_under compared the total rounded to 0 digits,\n  so 98.71% passed the 99% gate.\n\nCo-Authored-By: Claude Opus 5.5 (1M context) \u003cnoreply@anthropic.com\u003e\n","Terry Simons \u003cbr\u003eUnified input devices; the active scene must be a Scene\n\nUnified devices (plans\u002f2026-10-22-unified-input-devices.md, approved):\n- One InputDevice per physical device (glitchygames\u002finput\u002finput_devices.py):\n  a joystick layer always, a controller layer when SDL maps it, read from\n  the frame's snapshot; GameEngine\u002fSceneManager\u002fScene.input_devices and\n  Scene.on_input_device_added\u002fremoved.\n- Each device's input events reach handlers from one layer only (controller\n  if mapped, else joystick); --input-mode is a filter (auto = both, the\n  default); ActionMap gains an auto mode. Recorded and replayed identically\n  (TestDeviceDispatchReplays); golden replays unchanged.\n- Fixes #181\u002f#68 (controllers keyed by device index, looked up by instance\n  id: crash after a replug), the remap handler reading device_index, and a\n  controller unplugged before it could be opened raising out of the engine.\n- The joystick demo rewritten on it (1,422 -\u003e 318 lines, one rendering path,\n  no Any) and fully covered; the last ANN401 sites outside events\u002fbase.py\n  are gone. #184 logged (rumble still picks devices by mode, etc.).\n\nRequire Scene (the user's choice): switch_to_scene and request_transition\nrefuse anything but a Scene (TypeError), so the scene manager, recorder and\ncamera aim read Scene's attributes directly instead of defensive lookups.\n\nAlso: README\u002fCLAUDE.md\u002fdocs for devices; plans updated (typed events\napproved, with immutability and a cached hash).\n\nCo-Authored-By: Claude Opus 5.5 (1M context) \u003cnoreply@anthropic.com\u003e\n","Terry Simons \u003cbr\u003eBitmappy: public APIs instead of private reach-ins; trackers require an editor; #183\n\nThe last 11 Bitmappy Any sites (the user's choices: public APIs, editor\nrequired):\n- Undo commands use AnimatedSprite.animation_data \u002f pause() and a new\n  FilmStripWidget.refresh(recalculate_layout=...); the editor's undo\u002fredo\n  flag is public on EditorContext (applying_undo_redo).\n- The four operation trackers take a required, keyword-only EditorContext;\n  tests build them with a real editor (tests\u002ftools\u002fconftest.py).\n- #183: the aisuite timeout setup read client._providers, which aisuite 0.2\n  doesn't have (and providers are only built on the first request), so it\n  never set anything; and the ollama config carried request_timeout \u002f\n  read_timeout, which openai.OpenAI rejects, so every ollama request raised\n  TypeError. Timeouts now go in the client config; tested with a real\n  aisuite.Client and its real provider SDK clients, offline.\n\nCo-Authored-By: Claude Opus 5.5 (1M context) \u003cnoreply@anthropic.com\u003e\n","Terry Simons \u003cbr\u003eDebug overlay, visible-pixel hitboxes, frame anchoring and save-path fixes (#93)\n\nCo-authored-by: Claude Opus 5.5 (1M context) \u003cnoreply@anthropic.com\u003e"],"x":["2026-10-23T19:01:27","2026-10-22T21:49:03","2026-10-22T21:49:03","2026-10-22T21:49:02","2026-10-18T13:53:39"],"xcalendar":"gregorian","y":[364.2597842777874,173.4581117878637,364.2597842777874,173.4581117878637,0],"type":"scatter"},{"hoveron":"points+fills","ids":["b7d5bd57e87272d7dad1c2b0894c0c5e3368488d","f36f3ea6b73598a10d2567f552066a1ff2768d9b","b85fd61daaf693aec77c02a7bd15a79bc6749108","6693049987f4480c4e4833c75cc11b4dc7ee0fe8","eb56077a024ab5674225c6a9e033bb2571b06858","3a4f8416082c9426a783a74d8ebd26c572f30a2b","42fb9fe9c7d6e68f736037fe5b7f2692744fd8f9","2f044063c65f274ee559da5ae5ab849cd5cf90ce","a6ff394754e0fbfe0d4b6d3b981f3218f0df0079","57d3af7d15ceb95535424a70b36a153e8f5bbce9","8cbd5dc632358ab7d7b661baf2e78def535881ee","68cea4299d268d831208af79724c226e7ad1e064","10b0782d6855d1e4404c0ec5eac5700153413c9f","5e5472316e1d2ffefbf9b
