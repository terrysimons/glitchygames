# The reviewed re-record for PR #328: the HUD in the bundled Vera Bold at 16 (the owner,
# 2026-11-26). The plan scripts/check_rebaselined_recordings.py read (its docstring has the
# format; docs/architecture/gameplay_replay.md, "A reviewed re-record", the steps).
#
# Run from the repository root. OLD is each recording as it was on b86f61f19, the commit before
# the font change (f3b1459e7); NEW is the recording in the tree since f41d3c2c7. To put OLD back:
#
#   mkdir -p build/re-record/old
#   git archive b86f61f19 \
#       src/games/brave-adventurer/tests/fixtures/replays/golden-classic.jsonl.gz \
#       src/games/brave-adventurer/tests/fixtures/replays/golden-papyrus.jsonl.gz \
#       src/games/brave-adventurer/src/brave_adventurer_modes/demos/classic.jsonl.gz \
#       src/games/brave-adventurer/src/brave_adventurer_modes/demos/papyrus.jsonl.gz \
#       src/games/clockwork-keep/tests/fixtures/replays/golden.jsonl.gz \
#       src/games/clockwork-keep/src/clockwork_keep/demos/climb.jsonl.gz \
#       | tar -x -C build/re-record/old
#
# The fingerprints and images came from b86f61f19 (before) and f41d3c2c7 (after). Boxes are
# x, y, width, height: the union of each label's rects (and its shadow's, one pixel up and left)
# in both recordings.

[[pair]]
old = "build/re-record/old/src/games/brave-adventurer/tests/fixtures/replays/golden-classic.jsonl.gz"
new = "src/games/brave-adventurer/tests/fixtures/replays/golden-classic.jsonl.gz"

[pair.allowances]
sprite_ids_whose_rect_changes = [
  "HudLabel#0",
  "HudLabel#1",
  "HudLabel#2",
  "HudLabel#3",
]

