# taplo (nox -s format-toml, lint-toml): the project's own TOML files only. Not the submodules'
# (other projects' files: formatting third_party/pygame-ce/pyproject.toml dirtied the submodule)
# nor installed packages' (.venv/, .nox/) or build output
# src/quicklook: SwiftPM's own checkouts (.build/, which hold deliberately invalid TOML test
# files), and the sprite fixtures whose exact bytes the QuickLook tests depend on (CRLF line
# endings, ragged rows); formatting them would quietly stop those tests testing anything
# .claude/: Claude Code's worktrees (.claude/worktrees/<name>/) are other checkouts nested in this
# one, each on its own branch. Formatted from here they were rewritten mid-task (their CRLF
# fixtures included: the paths above are this checkout's, not theirs) (BUGS.md #271)
exclude = [
  ".claude/**",
  "third_party/**",
  ".venv/**",
  ".nox/**",
  "build/**",
  "src/quicklook/.build/**",
  "src/quicklook/tools/fixtures/**",
  "src/quicklook/Tests/SpriteCoreTests/Golden/**",
]
