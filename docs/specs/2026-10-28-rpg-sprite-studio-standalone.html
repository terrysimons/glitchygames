<div class="wrap">
  <div class="page-tag">Page 1 · Top-down RPG</div>
  <h1>The RPG Sprite Page</h1>
  <p class="sub">Laid out like the physical hub: keys top-left, the rollers in the skinny column beside them, knobs top-right with the dial tucked beneath, faders across the bottom.
    Green&nbsp;= settled; dashed&nbsp;= still a guess.</p>

  <div class="decks">
    <!-- CENTER-LEFT: keys (big) -->
    <div class="panel a-keys">
      <h2>Keys <span class="module">· M4315 · 3×5, seen as 5×3 (mounted 90°) · 72×72</span></h2>
      <div class="keys">
        <div class="key nav"><span class="lead">←</span><span class="cap">Prev Sprite</span></div>
        <div class="key"><div class="sprite"></div><span class="cap">Sprite</span><span class="cap name">Magic Mushroom</span></div>
        <div class="key nav"><span class="lead">→</span><span class="cap">Next Sprite</span></div>
        <div class="key dir"><span class="lead">NW</span></div>
        <div class="key dir"><span class="lead">N</span></div>
        <div class="key dir"><span class="lead">NE</span></div>
        <div class="key dir"><span class="lead">W</span></div>
        <div class="key center"><div class="sprite"></div><span class="cap">idle · S</span></div>
        <div class="key dir"><span class="lead">E</span></div>
        <div class="key dir"><span class="lead">SW</span></div>
        <div class="key dir"><span class="lead">S</span></div>
        <div class="key dir"><span class="lead">SE</span></div>
        <div class="key nav"><span class="lead">←</span><span class="cap">Prev Color</span></div>
        <div class="key"><div class="swatch"></div><span class="cap">Palette</span></div>
        <div class="key nav"><span class="lead">→</span><span class="cap">Next Color</span></div>

    <div class="a-right">

          (canvas · film-strip parent · each slider · color wheel · mini view); <b>press</b> to activate that

<script>
  // The sprite cells show the user's own purple mushroom (bitmappy sprite -> examples/webhid/shroom3.png,
  // 32x32 RGBA, magenta chroma keyed transparent), embedded as a data URI. A 3x5 page grid fills the pager.
