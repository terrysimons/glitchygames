<style>

  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper: #111318; --ink: #e7eaef; --muted: #9aa3b2; color-scheme: dark; } }

  body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--display); margin: 0; }
  main { max-width: 760px; margin: 0 auto; display: grid; gap: 16px;
    padding-block: 26px 46px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h1 { font-size: 1.4rem; margin: 0; text-wrap: balance; } p { color: var(--muted); margin: 0; max-width: 62ch; }
  .wrap { overflow-x: auto; }
  svg.deck { width: 100%; max-width: 620px; height: auto; display: block; filter: drop-shadow(0 8px 16px rgba(0,0,0,.4)); }
  .baseplate { fill: var(--plate); stroke: var(--plate-edge); stroke-width: 2; }
  .basestrip { fill: none; stroke: var(--strip); stroke-width: 3; opacity: .55; }
  .baseinner { fill: var(--inner); } .bgrid { stroke: var(--grid); stroke-width: 1; }
  .mbody { fill: url(#mbodyg); } .medge { fill: none; stroke: var(--medge); stroke-width: 1.5; }
  .shadow { fill: var(--shadow); opacity: .4; } .skirt { fill: var(--skirt); }
  .knurl { stroke: var(--knurl); stroke-width: 1.5; opacity: .6; } .cap { fill: var(--cap); }
  .ledring { fill: url(#frost); } .ledring-edge { fill: none; stroke: #aab2bd; stroke-width: 1.2; }
  .capwell { fill: #000; opacity: .3; } .knobsheen { fill: url(#sheen); } .caprim { fill: none; stroke: #0a0c0f; stroke-width: 1.4; }
  .rim { fill: none; stroke: var(--rim); stroke-width: 1.4; } .pointer { stroke: var(--pointer); stroke-width: 2.6; stroke-linecap: round; }
  .track { fill: var(--track); } .fcap { fill: var(--fcap); stroke: var(--rim); stroke-width: 1; }
  .fline { stroke: var(--fline); stroke-width: 2; stroke-linecap: round; opacity: .8; }
  .roller { fill: var(--roller); stroke: #000; stroke-width: 1; } .rbarrel { fill: url(#barrel); }
  .ridge { stroke: var(--ridge); stroke-width: 1.2; opacity: .6; } .rpeg { fill: var(--mbody-lo); stroke: #000; stroke-width: 1; }
  .rollarrow { fill: #cfe4ff; opacity: .95; }
  .key { fill: var(--key); stroke: #000; stroke-width: 1; } .screen { fill: var(--screen); }
  .screenface { fill: var(--screenface); } .dlight { fill: url(#dlight); } .dialbezel { fill: var(--dialbezel); }
  .off .screen, .off .screenface { fill: #000; }
  .off .ledring { fill: #16181c; }
  .off .dlight { opacity: 0; }
  .off .pointer, .off .fline { opacity: .3; }
  .off .fcap { opacity: .45; } .off .cap, .off .capwell, .off .knobsheen, .off .caprim { opacity: .5; }
  .off .roller, .off .rbarrel, .off .ridge, .off .rpeg { opacity: .45; }
  .off .key { opacity: .7; }
