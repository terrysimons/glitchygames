---
# Removes the service with the same script a player's package installs. Only when asked:
#   --tags ai_uninstall                         keeps the models
#   --tags ai_uninstall -e ai_uninstall_models=true   removes them too
- name: Remove the service on this platform
  ansible.builtin.include_tasks:
    # The file: form, as a free-form argument holding = is read as key=value options
    file: "{{ 'macos' if ansible_facts['system'] == 'Darwin' else 'linux' }}.yml"
