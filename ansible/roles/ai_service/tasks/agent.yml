---
- name: "Write settings: {{ agent.label }}"
  ansible.builtin.template:
    src: agent.env.j2
    dest: "{{ ai_service_config_directory }}/{{ agent.label }}.env"
    mode: "0644"
    validate: sh -n %s

- name: "Write the plist, valid or not at all: {{ agent.label }}"
  ansible.builtin.template:
    src: agent.plist.j2
    dest: "{{ ai_service_agents_directory }}/{{ agent.label }}.plist"
    mode: "0644"
    validate: plutil -lint %s

# From before the models started on demand: there it would load at every login, and a size disabled
# then couldn't be started now
- name: "Look for a plist in LaunchAgents: {{ agent.label }}"
  ansible.builtin.stat:
    path: "{{ ai_service_launch_agents_directory }}/{{ agent.label }}.plist"
    get_checksum: false
  register: ai_service_old_plist

- name: "Clear it out"
  when: ai_service_old_plist.stat.exists
  block:
    - name: "Stop the old agent: {{ agent.label }}"
      ansible.builtin.command:
        argv: [launchctl, bootout, "gui/{{ ansible_facts['user_uid'] }}/{{ agent.label }}"]
      register: ai_service_old_bootout
      failed_when: false
      changed_when: ai_service_old_bootout.rc == 0

    - name: "Remove the old plist: {{ agent.label }}"
      ansible.builtin.file:
        path: "{{ ai_service_launch_agents_directory }}/{{ agent.label }}.plist"
        state: absent

    - name: "Clear any disabled state: {{ agent.label }}"
      ansible.builtin.command:
        argv: [launchctl, enable, "gui/{{ ansible_facts['user_uid'] }}/{{ agent.label }}"]
      changed_when: true
