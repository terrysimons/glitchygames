---
- name: Refuse a size this host doesn't download
  ansible.builtin.assert:
    that:
      - ai_service_bonsai_size | length == 0 or ai_service_bonsai_size in ai_models_bonsai_sizes
      - ai_service_qwen_size in ai_models_qwen_sizes
    fail_msg: >-
      Asked for Bonsai {{ ai_service_bonsai_size }} and Qwen {{ ai_service_qwen_size }}, but this
      host downloads Bonsai {{ ai_models_bonsai_sizes }} and Qwen {{ ai_models_qwen_sizes }}

- name: List the agents
  ansible.builtin.import_tasks: list_agents.yml

# A size chosen by hand, which setup.sh and ai-service.sh read from selection.env: written here for
# both platforms, before the platform's install, as Linux's runs setup.sh
- name: Make the user's config folder
  ansible.builtin.file:
    path: "{{ ai_service_config_directory }}"
    state: directory
    mode: "0755"

- name: Record a size chosen by hand
  ansible.builtin.copy:
    content: "bonsai_override={{ ai_service_bonsai_size | quote }}\n"
    dest: "{{ ai_service_config_directory }}/selection.env"
    mode: "0644"
  when: ai_service_bonsai_size | length > 0

- name: Otherwise let each run choose
  ansible.builtin.file:
    path: "{{ ai_service_config_directory }}/selection.env"
    state: absent
  when: ai_service_bonsai_size | length == 0

# The Mac writes everything itself; Linux installs the .deb and runs its setup.sh for the owner
# (plans/lucid-circuit-linux.md, 6.3). Both end with the same smoke test
- name: Install the service on this platform
  ansible.builtin.include_tasks:
    # The file: form, as a free-form argument holding = is read as key=value options
    file: "{{ 'macos' if ansible_facts['system'] == 'Darwin' else 'linux' }}.yml"
