---
- name: Pick the Bonsai size for this machine's memory
  ansible.builtin.set_fact:
    ai_service_selected_bonsai_size: >-
      {{ ai_service_bonsai_size
         if ai_service_bonsai_size | length > 0
         else (ai_service_bonsai_tiers
               | selectattr('minimum_memory_mb', 'le', ansible_facts['memtotal_mb'] | int)
               | map(attribute='size') | list | last) }}

- name: Refuse a size this host doesn't download
  ansible.builtin.assert:
    that:
      - ai_service_selected_bonsai_size in ai_models_bonsai_sizes
      - ai_service_qwen_size in ai_models_qwen_sizes
    fail_msg: >-
      Selected Bonsai {{ ai_service_selected_bonsai_size }} and Qwen {{ ai_service_qwen_size }},
      but this host downloads Bonsai {{ ai_models_bonsai_sizes }} and Qwen {{ ai_models_qwen_sizes }}

- name: List an agent for each installed Bonsai size
  ansible.builtin.set_fact:
    ai_service_agents: >-
      {{ (ai_service_agents | default([])) + [{
           'label': ai_service_label_prefix ~ '.bonsai-2-' ~ item ~ '.llama-cpp',
           'role': 'reasoning',
           'alias': 'bonsai-2-' ~ item,
           'port': ai_service_bonsai_ports[item],
           'model_file': ai_models_bonsai[item].model.file,
           'vision_file': ai_models_bonsai[item].vision.file,
           'selected': item == ai_service_selected_bonsai_size}] }}
  loop: "{{ ai_models_bonsai_sizes }}"

- name: List an agent for each installed Qwen size
  ansible.builtin.set_fact:
    ai_service_agents: >-
      {{ ai_service_agents + [{
           'label': ai_service_label_prefix ~ '.qwen3-embedding-' ~ item ~ '.llama-cpp',
           'role': 'embedding',
           'alias': 'qwen3-embedding-' ~ item,
           'port': ai_service_qwen_ports[item],
           'model_file': ai_models_qwen[item].model.file,
           'dimensions': ai_models_qwen[item].dimensions,
           'selected': item == ai_service_qwen_size}] }}
  loop: "{{ ai_models_qwen_sizes }}"

- name: Make the service's directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ ai_cache_root }}"
    - "{{ ai_service_bin_directory }}"
    - "{{ ai_service_config_directory }}"
    - "{{ ai_log_root }}"
    - "{{ ai_service_launch_agents_directory }}"

- name: Generate the workers' API key
  ansible.builtin.shell:
    cmd: umask 077 && openssl rand -hex 32 > {{ ai_service_api_key_file | quote }}
    creates: "{{ ai_service_api_key_file }}"

- name: Install the script each agent runs
  ansible.builtin.template:
    src: run-llama-server.sh.j2
    dest: "{{ ai_service_runner }}"
    mode: "0755"
    validate: sh -n %s
  register: ai_service_runner_result

- name: Install the uninstaller
  ansible.builtin.template:
    src: uninstall.sh.j2
    dest: "{{ ai_service_bin_directory }}/uninstall.sh"
    mode: "0755"
    validate: sh -n %s

- name: Install and set the state of each agent
  ansible.builtin.include_tasks: agent.yml
  loop: "{{ ai_service_agents }}"
  loop_control:
    loop_var: agent
    label: "{{ agent.label }}"

- name: Check that the running agents answer correctly
  ansible.builtin.include_tasks: smoke_test.yml
