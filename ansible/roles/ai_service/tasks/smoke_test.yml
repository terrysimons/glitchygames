---
# Starts what a game would get, checks it, and stops it again, so an install leaves nothing running
- name: Start the models this machine would pick now
  ansible.builtin.command:
    argv: ["{{ ai_service_control }}", start]
  register: ai_service_started
  changed_when: false

- name: Read which sizes it picked
  ansible.builtin.set_fact:
    ai_service_running_labels:
      - >-
        {{ ai_service_label_prefix }}.bonsai-2-{{
           ai_service_started.stdout | regex_search('^bonsai=(.+)$', '\1', multiline=True) | first }}.llama-cpp
      - >-
        {{ ai_service_label_prefix }}.qwen3-embedding-{{
           ai_service_started.stdout | regex_search('^qwen=(.+)$', '\1', multiline=True) | first }}.llama-cpp

- name: Check the running models, and stop them whatever happens
  block:
    - name: Wait for the models to load
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ item.port }}/health"
        status_code: 200
      register: ai_service_health
      until: ai_service_health.status == 200
      retries: "{{ ai_service_ready_retries }}"
      delay: "{{ ai_service_ready_delay_seconds }}"
      loop: "{{ ai_service_agents | selectattr('label', 'in', ai_service_running_labels) | list }}"
      loop_control:
        label: "{{ item.label }}"

    - name: Describe the smoke test
      ansible.builtin.copy:
        content: >-
          {{ {'models': ai_service_agents | selectattr('label', 'in', ai_service_running_labels) | list,
              'api_key_file': ai_service_api_key_file} | to_nice_json }}
        dest: "{{ ai_cache_root }}/smoke-test.json"
        mode: "0600"
      changed_when: false

    # Loading isn't enough: an older build loads these files without warning and writes gibberish
    - name: Ask the running models questions with known answers
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ role_path }}/files/smoke_test.py"
          - --config
          - "{{ ai_cache_root }}/smoke-test.json"
      register: ai_service_smoke_test
      changed_when: false

    - name: Report the smoke test
      ansible.builtin.debug:
        var: ai_service_smoke_test.stdout_lines

    # Run by the sidecar's own Python, as a check that it holds what a client needs too
    - name: Use the API as a game would
      ansible.builtin.command:
        argv:
          - "{{ ai_sidecar_directory }}/python/bin/python3.14"
          - "{{ role_path }}/files/api_smoke_test.py"
          - --port
          - "{{ ai_service_api_port }}"
          - --key-file
          - "{{ ai_service_service_key_file }}"
      environment:
        PYTHONPATH: "{{ ai_sidecar_directory }}/site"
      register: ai_service_api_smoke_test
      changed_when: false

    - name: Report the API's smoke test
      ansible.builtin.debug:
        var: ai_service_api_smoke_test.stdout_lines
  always:
    - name: Stop the models until a game asks for them
      ansible.builtin.command:
        argv: ["{{ ai_service_control }}", stop]
      changed_when: false
