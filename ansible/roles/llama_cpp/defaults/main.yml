---
# The newest build tag when this was pinned (2026-11-06). Stock llama.cpp runs Bonsai 2's Q2_0 files
# from b11556 on, and an older build loads them without warning and writes gibberish
# (https://huggingface.co/prism-ml/Ternary-Bonsai-2-27B-gguf/blob/main/KNOWN_ISSUES.md). A newer tag
# is a deliberate update: change both values, then run the ai_service smoke test again.
llama_cpp_tag: b12167
llama_cpp_commit: 240d68fcfe0c2a1f298c8e18ca181368b1914259
llama_cpp_repository: https://github.com/ggml-org/llama.cpp.git

# The oldest macOS the built binary runs on
llama_cpp_macos_deployment_target: "14.0"

# Free disk space the source and the build need
llama_cpp_required_free_megabytes: 4096

# Always set, whatever the host's llama_cpp_cmake_options add. The web UI is off because its default
# fetches a prebuilt copy from a Hugging Face bucket during the build, and this service has no use
# for it. OpenSSL is off because it would link Homebrew's copy, which a player's Mac doesn't have, and
# the service only speaks HTTP over loopback; Prism's build_mac.sh turns it off too. Options at the
# pinned tag: https://github.com/ggml-org/llama.cpp/blob/b12167/CMakeLists.txt
llama_cpp_base_cmake_options:
  CMAKE_BUILD_TYPE: Release
  BUILD_SHARED_LIBS: "OFF"
  LLAMA_OPENSSL: "OFF"
  LLAMA_BUILD_TESTS: "OFF"
  LLAMA_BUILD_EXAMPLES: "OFF"
  LLAMA_BUILD_UI: "OFF"
  LLAMA_USE_PREBUILT_UI: "OFF"

# The inventory's macos group sets the Metal options
llama_cpp_cmake_options: {}

# Added on Linux, over the base options, and the same on both architectures: one build holds every
# CPU variant of its architecture (llama_cpp_cpu_variants) and llama-server loads the best one the
# CPU supports when it starts, so nothing here names a CPU, and GGML_CPU_ARM_ARCH, which
# GGML_CPU_ALL_VARIANTS refuses, is never set. The shared libraries sit in the runtime's lib/, found
# by the $ORIGIN-relative RPATH (the last two options); the CPU variant modules sit in bin/. Options at the pinned tag:
# https://github.com/ggml-org/llama.cpp/blob/b12167/ggml/CMakeLists.txt
llama_cpp_linux_cmake_options:
  GGML_NATIVE: "OFF"
  GGML_BACKEND_DL: "ON"
  GGML_CPU_ALL_VARIANTS: "ON"
  BUILD_SHARED_LIBS: "ON"
  GGML_VULKAN: "OFF"
  GGML_OPENMP: "OFF"
  CMAKE_BUILD_WITH_INSTALL_RPATH: "ON"
  CMAKE_INSTALL_RPATH: "$ORIGIN/../lib"

# The CPU variants GGML_CPU_ALL_VARIANTS builds at b12167, by architecture (read from
# ggml/src/CMakeLists.txt; plans/lucid-circuit-linux.md section 4). A build missing one is refused
llama_cpp_cpu_variants:
  aarch64: [armv8.0_1, armv8.2_1, armv8.2_2, armv8.2_3, armv8.6_1, armv8.6_2, armv9.2_1, armv9.2_2]
  x86_64:
    - x64
    - sse42
    - sandybridge
    - ivybridge
    - piledriver
    - haswell
    - skylakex
    - cannonlake
    - cascadelake
    - icelake
    - cooperlake
    - zen4
    - alderlake
    - sapphirerapids

# What ldd may list for the Linux build's binary and libraries, besides the runtime's own: the
# loader and vdso, and glibc's, libstdc++ and libgcc, resolved from the system's /lib or /usr/lib
# (never /usr/local, and never "not found")
llama_cpp_system_link_pattern: '^\s*(linux-vdso\S* |/lib\S*/ld-linux\S* |(lib(c|m|dl|pthread|rt)\.so|libstdc\+\+\.so|libgcc_s\.so|ld-linux)\S* => /(usr/)?lib)'

# The first GCC release whose libstdc++ has each symbol version, so the .deb can depend on a
# libstdc++6 at least that new (Debian's and Ubuntu's libstdc++6 is versioned by the GCC release it
# comes from). From GCC's ABI policy, the symbol versioning list
# (https://gcc.gnu.org/onlinedocs/libstdc++/manual/abi.html, read 2026-11-18). A version the build
# needs that is missing here is refused: add it from that list. GLIBCXX_3.4.28 came with 9.3.0 and
# again 10.1.0; GCC 16.1.0 added CXXABI_1.3.17 and no GLIBCXX version, so both kinds are read
llama_cpp_glibcxx_releases:
  "3.4": 3.4.0
  "3.4.1": 3.4.1
