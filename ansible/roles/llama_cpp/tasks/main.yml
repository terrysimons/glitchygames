---
- name: Refuse anything but an Apple Silicon Mac
  ansible.builtin.assert:
    that:
      - ansible_facts['system'] == 'Darwin'
      - ansible_facts['machine'] == 'arm64'
    fail_msg: "This builds for Apple Silicon only; this is {{ ansible_facts['system'] }} {{ ansible_facts['machine'] }}"

# Plain `xcrun --show-sdk-version` can follow a stale path to the Command Line Tools' SDK while
# `--sdk macosx` finds Xcode's, so the build names the SDK it found this way
- name: Find the macOS SDK
  ansible.builtin.command:
    argv: [xcrun, --sdk, macosx, --show-sdk-path]
  register: llama_cpp_sdk
  changed_when: false

- name: Check that CMake is installed
  ansible.builtin.command:
    argv: [cmake, --version]
  changed_when: false

- name: Work out this build's options and where it installs
  ansible.builtin.set_fact:
    llama_cpp_all_cmake_options: >-
      {{ llama_cpp_base_cmake_options
         | combine(llama_cpp_cmake_options)
         | combine({'CMAKE_OSX_ARCHITECTURES': 'arm64',
                    'CMAKE_OSX_DEPLOYMENT_TARGET': llama_cpp_macos_deployment_target,
                    'CMAKE_OSX_SYSROOT': llama_cpp_sdk.stdout}) }}

# Named by the tag and the options, so changing either builds beside the old one and rollback works
- name: Name the install directory
  ansible.builtin.set_fact:
    llama_cpp_install_directory: >-
      {{ ai_install_root }}/runtime/llama.cpp-{{ llama_cpp_tag }}-{{
         (llama_cpp_all_cmake_options | to_json(sort_keys=True) | hash('sha256'))[:12] }}
    llama_cpp_build_directory: >-
      {{ ai_cache_root }}/llama.cpp/build-{{ llama_cpp_tag }}-{{
         (llama_cpp_all_cmake_options | to_json(sort_keys=True) | hash('sha256'))[:12] }}

- name: Look for this build
  ansible.builtin.stat:
    path: "{{ llama_cpp_install_directory }}/bin/llama-server"
  register: llama_cpp_installed_binary

- name: Build llama.cpp
  when: not llama_cpp_installed_binary.stat.exists
  block:
    - name: Measure the free disk space
      ansible.builtin.command:
        argv: [df, -m, "{{ ai_home }}"]
      register: llama_cpp_disk
      changed_when: false

    - name: Refuse to build without the disk space
      ansible.builtin.assert:
        that: (llama_cpp_disk.stdout_lines[-1].split()[3] | int) >= llama_cpp_required_free_megabytes
        fail_msg: "The build needs {{ llama_cpp_required_free_megabytes }} MB free"

    - name: Make the cache directory
      ansible.builtin.file:
        path: "{{ ai_cache_root }}/llama.cpp"
        state: directory
        mode: "0755"

    # A plain clone: ansible.builtin.git (ansible-core 2.22) fails with "'NoneType' object has no
    # attribute 'startswith'" when run again over a shallow checkout of a tag
    - name: Fetch the source at the pinned tag
      ansible.builtin.command:
        argv:
          - git
          - clone
          - --depth=1
          - --branch
          - "{{ llama_cpp_tag }}"
          - "{{ llama_cpp_repository }}"
          - "{{ llama_cpp_source_directory }}"
        creates: "{{ llama_cpp_source_directory }}/.git"

    - name: Read the commit the tag gave
      ansible.builtin.command:
        argv: [git, rev-parse, HEAD]
        chdir: "{{ llama_cpp_source_directory }}"
      register: llama_cpp_fetched_commit
      changed_when: false

    - name: Refuse a tag that moved
      ansible.builtin.assert:
        that: llama_cpp_fetched_commit.stdout == llama_cpp_commit
        fail_msg: >-
          {{ llama_cpp_tag }} is {{ llama_cpp_fetched_commit.stdout }}, not the pinned
          {{ llama_cpp_commit }}

    - name: Turn the options into CMake's arguments
      ansible.builtin.set_fact:
        llama_cpp_cmake_arguments: "{{ llama_cpp_cmake_arguments | default([]) + ['-D' ~ item.key ~ '=' ~ item.value] }}"
      loop: "{{ llama_cpp_all_cmake_options | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Configure the build
      ansible.builtin.command:
        argv: "{{ ['cmake', '-S', llama_cpp_source_directory, '-B', llama_cpp_build_directory] + llama_cpp_cmake_arguments }}"
      changed_when: true

    - name: Compile llama-server
      ansible.builtin.command:
        argv:
          - cmake
          - --build
          - "{{ llama_cpp_build_directory }}"
          - --target
          - llama-server
          - --parallel
          - "{{ ansible_facts['processor_vcpus'] | default(ansible_facts['processor_cores']) }}"
      changed_when: true

    - name: Make the install directories
      ansible.builtin.file:
        path: "{{ llama_cpp_install_directory }}/{{ item }}"
        state: directory
        mode: "0755"
      loop: [bin, notices]

    # The binary last, as its presence is what says this build is installed
    - name: Install llama.cpp's license
      ansible.builtin.copy:
        src: "{{ llama_cpp_source_directory }}/LICENSE"
        dest: "{{ llama_cpp_install_directory }}/notices/llama.cpp-LICENSE"
        mode: "0644"

    - name: Install llama-server
      ansible.builtin.copy:
        src: "{{ llama_cpp_build_directory }}/bin/llama-server"
        dest: "{{ llama_cpp_install_directory }}/bin/llama-server"
        mode: "0755"

- name: Read the installed build's version
  ansible.builtin.command:
    argv: ["{{ llama_cpp_install_directory }}/bin/llama-server", --version]
  register: llama_cpp_version_output
  changed_when: false

- name: List the devices the build can use
  ansible.builtin.command:
    argv: ["{{ llama_cpp_install_directory }}/bin/llama-server", --list-devices]
  register: llama_cpp_devices
  changed_when: false

- name: List the libraries it links
  ansible.builtin.command:
    argv: [otool, -L, "{{ llama_cpp_install_directory }}/bin/llama-server"]
  register: llama_cpp_linked_libraries
  changed_when: false

- name: Check that it's the pinned build, with Metal, and needs nothing from Homebrew
  ansible.builtin.assert:
    that:
      # By commit: the shallow clone makes the version's own build number read 1
      - ('commit ' ~ llama_cpp_commit[:7]) in (llama_cpp_version_output.stdout ~ llama_cpp_version_output.stderr)
      - "'MTL' in (llama_cpp_devices.stdout ~ llama_cpp_devices.stderr)"
      - "'/opt/homebrew' not in llama_cpp_linked_libraries.stdout"
      - "'/usr/local' not in llama_cpp_linked_libraries.stdout"
    fail_msg: >-
      {{ llama_cpp_version_output.stdout }} {{ llama_cpp_version_output.stderr }}
      {{ llama_cpp_devices.stdout }} {{ llama_cpp_devices.stderr }}
      {{ llama_cpp_linked_libraries.stdout }}

- name: Say what's installed
  ansible.builtin.debug:
    msg:
      - "{{ llama_cpp_install_directory }}"
      - "{{ llama_cpp_version_output.stderr_lines | default([]) }}"
      - "{{ llama_cpp_devices.stdout_lines | default([]) }}"
