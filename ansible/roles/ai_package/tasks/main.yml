---
# Builds the package from what the other roles installed: a .pkg on a Mac, a .deb on Linux
# (plans/lucid-circuit-linux.md, 6.7). It holds no model: those are downloaded after install by the
# setup job this role renders. Rebuilt only when something in it changed.
- name: Stage what every platform's package holds
  ansible.builtin.import_tasks: stage.yml

- name: Stage and build this platform's package
  ansible.builtin.include_tasks:
    file: "{{ 'macos' if ansible_facts['system'] == 'Darwin' else 'linux' }}.yml"
