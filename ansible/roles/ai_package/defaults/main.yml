---
# Shared by the Mac's .pkg and Linux's .deb
ai_package_version: 0.1.0
# Unsigned until there are Developer ID certificates (plans/lucid-circuit.md, section 6). Gatekeeper
# blocks an unsigned package that was downloaded, so this one only suits the Mac that built it
ai_package_directory: "{{ ai_cache_root }}/package"
ai_package_stage: "{{ ai_package_directory }}/stage"
ai_package_scripts: "{{ ai_package_directory }}/scripts"
# Where the programs sit in the stage: the .pkg installs into the player's home, the .deb into the
# program folder under /opt, where Linux's llama.cpp and sidecar are already built
# (plans/lucid-circuit-linux.md, 6.1)
ai_package_stage_root: >-
  {{ ai_package_stage ~ (ai_program_root if ansible_facts['system'] == 'Linux'
     else '/Library/Application Support/GlitchyGames/AI') }}
# setup.sh's counterpart: on Linux the package's own files are dpkg's, so this removes one user's
# part only (plans/lucid-circuit-linux.md, 6.1 and 6.9)
ai_package_uninstaller_name: >-
  {{ 'uninstall-user.sh' if ansible_facts['system'] == 'Linux' else 'uninstall.sh' }}
ai_package_output: "{{ ai_package_directory }}/GlitchyGames-AI-{{ ai_package_version }}.pkg"
ai_package_component: "{{ ai_package_directory }}/component.pkg"
ai_package_distribution: "{{ ai_package_directory }}/distribution.xml"

# Written into plists and settings, and replaced with the player's home when they install
ai_package_home_placeholder: __GLITCHYGAMES_HOME__
# The Linux package's settings name the user's folder and the program folder by these, as each
# user's folder follows their own XDG_DATA_HOME or GLITCHYGAMES_AI_USER_ROOT: setup.sh fills them
# in (plans/lucid-circuit-linux.md, 6.3). The # makes the quote filter single-quote any path that
# holds one, so setup.sh can escape the folder it puts there for a single-quoted shell word
ai_package_user_root_placeholder: "#GLITCHYGAMES_USER_ROOT#"
ai_package_program_root_placeholder: "#GLITCHYGAMES_PROGRAM_ROOT#"

# A player's Mac gets the model the setup picks, not every size: 13.93 GB is a lot to take from a
# small disk (plans/lucid-circuit.md, section 10, question 6). They can ask for another later
ai_package_setup_label: "{{ ai_service_label_prefix }}.setup"

# The .deb (plans/lucid-circuit-linux.md, 6.7), built with dpkg-deb from the stage: the programs
# under ai_program_root, the user units, and Debian's control file and maintainer scripts
ai_package_deb_name: glitchygames-ai
# The link in the runtime folder that names this package's build. Every user's settings name the
# runtime through it, so an upgrade to a build of another name leaves their settings right
ai_package_runtime_link: current
# Debian's names for the architectures Ansible reports (plans/lucid-circuit-linux.md, section 4)
ai_package_deb_architectures:
  aarch64: arm64
  x86_64: amd64
ai_package_deb_architecture: "{{ ai_package_deb_architectures[ansible_facts['architecture']] }}"
ai_package_deb_output: >-
  {{ ai_package_directory }}/{{ ai_package_deb_name }}_{{ ai_package_version }}_{{ ai_package_deb_architecture }}.deb
ai_package_deb_control_directory: "{{ ai_package_stage }}/DEBIAN"
# systemd's folder for user units a package installs: every user's manager reads it
ai_package_units_stage: "{{ ai_package_stage }}/usr/lib/systemd/user"
ai_package_deb_maintainer: GlitchyGames
ai_package_deb_homepage: https://glitchygames.ai/
# What the binaries need from the system: glibc and the C++ runtime at least as new as the build
# used (the llama_cpp role reads both from the binaries), and the tools the scripts call. iproute2
# is ss, which the port check needs: without it every port reads as free
ai_package_deb_depends:
  - libc6 (>= {{ llama_cpp_glibc_version }})
  - libstdc++6 (>= {{ llama_cpp_libstdcxx_version }})
  - libgcc-s1
  - systemd
  - curl
  - openssl
  - ca-certificates
  - coreutils
  - iproute2
