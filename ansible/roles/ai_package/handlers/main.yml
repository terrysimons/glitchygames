---
# Each platform's build, all three listening for the one notification the shared staging sends
- name: Build the package
  ansible.builtin.command:
    argv:
      - pkgbuild
      - --root
      - "{{ ai_package_stage }}"
      - --identifier
      - "{{ ai_package_identifier }}"
      - --version
      - "{{ ai_package_version }}"
      - --install-location
      - /
      - --ownership
      - recommended
      - --scripts
      - "{{ ai_package_scripts }}"
      - "{{ ai_package_component }}"
  listen: Build the package
  when: ansible_facts['system'] == 'Darwin'
  changed_when: true

- name: Wrap the package for a home-folder install
  ansible.builtin.command:
    argv:
      - productbuild
      - --distribution
      - "{{ ai_package_distribution }}"
      - --package-path
      - "{{ ai_package_directory }}"
      - "{{ ai_package_output }}"
  listen: Build the package
  when: ansible_facts['system'] == 'Darwin'
  changed_when: true

# Every file root's, whoever built it (plans/lucid-circuit-linux.md, 6.7)
- name: Build the Debian package
  ansible.builtin.command:
    argv:
      - dpkg-deb
      - --root-owner-group
      - --build
      - "{{ ai_package_stage }}"
      - "{{ ai_package_deb_output }}"
  listen: Build the package
  when: ansible_facts['system'] == 'Linux'
  changed_when: true
