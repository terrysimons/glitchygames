---
# Ubuntu's desktop is GNOME under gdm3: gdm3 logs the runner's user in, and dconf's system
# defaults keep the session awake
# The display is the job's: its session starts at boot, and the owner switches users to play
- name: Log the runner's user in at boot
  ansible.builtin.blockinfile:
    path: /etc/gdm3/custom.conf
    insertafter: '^\[daemon\]'
    block: |
      AutomaticLoginEnable=true
      AutomaticLogin={{ ci_user }}

- name: Create the system's desktop defaults directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/dconf/db/local.d
    - /etc/dconf/profile

# A sleeping output stops presenting frames, and a locked session measures nothing
- name: Keep the desktop session's display on
  ansible.builtin.copy:
    content: |
      [org/gnome/desktop/session]
      idle-delay=uint32 0

      [org/gnome/desktop/screensaver]
      lock-enabled=false

      [org/gnome/settings-daemon/plugins/power]
      sleep-inactive-ac-type='nothing'
    dest: /etc/dconf/db/local.d/00-hardware-runner
    mode: "0644"
  notify: Update the desktop defaults

- name: Make sure the desktop reads the system's defaults
  ansible.builtin.copy:
    content: |
      user-db:user
      system-db:local
    dest: /etc/dconf/profile/user
    force: false
    mode: "0644"
  notify: Update the desktop defaults

# The runner's display mode (raspberry_pi_display_mode: 1920x1080 at 120 Hz), applied with GNOME's
# own tool, gdctl (GNOME reverts what isn't set through its tools: the owner, 2026-11-14). GNOME 50
# saves a display change only when someone clicks Keep in its confirmation dialog and reverts it
# after 20 seconds otherwise; nothing a script can call confirms it (mutter's
# meta-monitor-manager.c; the Pis' journals, 2026-11-14). So the mode is applied temporarily, which
# asks nothing, by apply_display_mode (the planner reads mutter's state, gdctl sets the mode): at
# every login through the runner's autostart entry, and on every deploy, which then proves it held
# past the 20 s. Without a session yet (before the auto-login's first boot) the deploy changes
# nothing, and the login does it
- name: Create the directory for the Pi's own scripts
  ansible.builtin.file:
    path: /usr/local/lib/glitchygames
    state: directory
    mode: "0755"

- name: Install the display mode planner
  ansible.builtin.copy:
    src: plan_display_mode.py
    dest: /usr/local/lib/glitchygames/plan_display_mode.py
    mode: "0755"

- name: Install the display mode wrapper
  ansible.builtin.copy:
    src: apply_display_mode
    dest: /usr/local/lib/glitchygames/apply_display_mode
    mode: "0755"

# The first build's script, which applied the mode itself (2026-11-14); the planner replaced it
- name: Remove the replaced display script
  ansible.builtin.file:
    path: /usr/local/lib/glitchygames/set_display_mode.py
    state: absent

- name: Create the runner's autostart directory
  ansible.builtin.file:
    path: "{{ raspberry_pi_runner_home }}/.config/autostart"
    state: directory
    owner: "{{ ci_user }}"
    group: "{{ ci_user }}"
    mode: "0755"

- name: Apply the display mode at each login
  ansible.builtin.copy:
    dest: "{{ raspberry_pi_runner_home }}/.config/autostart/glitchygames-display-mode.desktop"
    owner: "{{ ci_user }}"
    group: "{{ ci_user }}"
    mode: "0644"
    content: |
      [Desktop Entry]
      Type=Application
      Name=GlitchyGames display mode
      Comment=Sets this session's display mode with gdctl at login (ansible/raspberry_pi_runner.yml)
      Exec=/usr/local/lib/glitchygames/apply_display_mode {{ raspberry_pi_display_mode.width }} {{ raspberry_pi_display_mode.height }} {{ raspberry_pi_display_mode.refresh_rates | join(',') }}
      NoDisplay=true
      X-GNOME-Autostart-enabled=true

- name: Set the runner's display mode
  become: true
  become_user: "{{ ci_user }}"
  environment:
    XDG_RUNTIME_DIR: /run/user/{{ raspberry_pi_runner_user.uid }}
    DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/{{ raspberry_pi_runner_user.uid }}/bus
  block:
    # Exits 1 (failing the run) when the monitor can't show the size
    - name: Apply the display mode as a login does
      ansible.builtin.command:
        argv:
          - /usr/local/lib/glitchygames/apply_display_mode
          - "{{ raspberry_pi_display_mode.width }}"
          - "{{ raspberry_pi_display_mode.height }}"
          - "{{ raspberry_pi_display_mode.refresh_rates | join(',') }}"
      register: raspberry_pi_display_applied
      changed_when: raspberry_pi_display_applied.stdout.startswith('apply ')

    - name: Wait past GNOME's 20-second revert
      ansible.builtin.pause:
        seconds: 25
      when: raspberry_pi_display_applied.changed and not ansible_check_mode

    - name: Check the mode held
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - /usr/local/lib/glitchygames/plan_display_mode.py
          - --width
          - "{{ raspberry_pi_display_mode.width }}"
          - --height
          - "{{ raspberry_pi_display_mode.height }}"
          - --refresh-rates
          - "{{ raspberry_pi_display_mode.refresh_rates | join(',') }}"
      register: raspberry_pi_display_check
      changed_when: false
      failed_when: (raspberry_pi_display_check.stdout | from_json).action != 'none'
      when: raspberry_pi_display_applied.changed and not ansible_check_mode
