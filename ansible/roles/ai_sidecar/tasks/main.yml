---
# Builds under the cache, keyed by what goes in, then syncs to the install, so a rerun with nothing
# changed does nothing. The package takes its copy from the same build
- name: Hash what the packages come from
  ansible.builtin.stat:
    path: "{{ ai_sidecar_project }}/uv.lock"
    checksum_algorithm: sha256
  register: ai_sidecar_lock

- name: Name this build
  ansible.builtin.set_fact:
    ai_sidecar_build: >-
      {{ ai_sidecar_build_directory }}/{{ ai_sidecar_python_version }}-{{ ai_sidecar_lock.stat.checksum[:12] }}

- name: Look for this build
  ansible.builtin.stat:
    path: "{{ ai_sidecar_build }}/.complete"
    get_checksum: false
  register: ai_sidecar_complete

- name: Build the Python and its packages
  when: not ai_sidecar_complete.stat.exists
  block:
    - name: Start from nothing
      ansible.builtin.file:
        path: "{{ ai_sidecar_build }}"
        state: absent

    - name: Make the build directory
      ansible.builtin.file:
        path: "{{ ai_sidecar_build }}"
        state: directory
        mode: "0755"

    - name: Install the standalone Python into uv's cache
      ansible.builtin.command:
        argv: [uv, python, install, "{{ ai_sidecar_python_version }}"]
      changed_when: true

    - name: Find uv's Python directory
      ansible.builtin.command:
        argv: [uv, python, dir]
      register: ai_sidecar_python_directory
      changed_when: false

    # A copy, with what a server never uses left out
    - name: Copy the Python
      ansible.builtin.command:
        argv:
          - rsync
          - -a
          - --exclude=lib/python*/test/
          - --exclude=lib/python*/idlelib/
          - --exclude=lib/python*/tkinter/
          - --exclude=lib/tcl*
          - --exclude=lib/tk*
          - --exclude=include/
          - "{{ ai_sidecar_python_directory.stdout }}/{{ ai_sidecar_python_build }}/"
          - "{{ ai_sidecar_build }}/python/"
      changed_when: true

    - name: Write the pinned requirements
      ansible.builtin.command:
        argv:
          - uv
          - export
          - --frozen
          - --no-dev
          - --no-emit-project
          - --project
          - "{{ ai_sidecar_project }}"
          - --output-file
          - "{{ ai_sidecar_build }}/requirements.txt"
      changed_when: true

    # Into a plain folder, each checked against the lock file's hash
    - name: Install the packages
      ansible.builtin.command:
        argv:
          - uv
          - pip
          - install
          - --python
          - "{{ ai_sidecar_build }}/python/bin/python3.14"
          - --target
          - "{{ ai_sidecar_build }}/site"
          - --require-hashes
          - --requirement
          - "{{ ai_sidecar_build }}/requirements.txt"
      changed_when: true

    - name: Fetch Scalar's script, by checksum
      ansible.builtin.command:
        argv:
          - curl
          - --fail
          - --location
          - --silent
          - --show-error
          - --connect-timeout
          - "30"
          - --retry
          - "5"
          - --retry-all-errors
          - --output
          - "{{ ai_sidecar_build }}/scalar.js"
          - "{{ ai_sidecar_scalar_url }}"
      changed_when: true

    - name: Hash Scalar's script
      ansible.builtin.stat:
        path: "{{ ai_sidecar_build }}/scalar.js"
        checksum_algorithm: sha256
      register: ai_sidecar_scalar

    - name: Refuse a Scalar script that changed
      ansible.builtin.assert:
        that: ai_sidecar_scalar.stat.checksum == ai_sidecar_scalar_sha256
        fail_msg: "Scalar's script hashed to {{ ai_sidecar_scalar.stat.checksum }}"

    - name: Mark the build complete
      ansible.builtin.file:
        path: "{{ ai_sidecar_build }}/.complete"
        state: touch
        mode: "0644"

- name: Make the sidecar directory
  ansible.builtin.file:
    path: "{{ ai_sidecar_install_directory }}/site"
    state: directory
    mode: "0755"

# rsync lists what it changed, so a rerun reports nothing
- name: Sync the build to the install
  ansible.builtin.command:
    argv:
      - rsync
      - -a
      - --delete
      - --itemize-changes
      - --exclude=.complete
      - --exclude=requirements.txt
      - --exclude=site/glitchygames_ai_service/
      - --exclude=__pycache__/
      - "{{ ai_sidecar_build }}/"
      - "{{ ai_sidecar_install_directory }}/"
  register: ai_sidecar_synced
  changed_when: ai_sidecar_synced.stdout | length > 0

# The service's own code, from the source each run: it changes more often than its packages
- name: Sync the service's code
  ansible.builtin.command:
    argv:
      - rsync
      - -a
      - --delete
      - --itemize-changes
      - --exclude=__pycache__/
      - "{{ ai_sidecar_project }}/src/glitchygames_ai_service/"
      - "{{ ai_sidecar_install_directory }}/site/glitchygames_ai_service/"
  register: ai_sidecar_code_synced
  changed_when: ai_sidecar_code_synced.stdout | length > 0

- name: Check the sidecar uses nothing outside itself
  ansible.builtin.command:
    argv:
      - "{{ ai_sidecar_install_directory }}/python/bin/python3.14"
      - -c
      - >-
        import sys, os, fastapi, glitchygames_ai_service;
        root = os.path.realpath(sys.argv[1]);
        paths = [sys.base_prefix, os.__file__, fastapi.__file__, glitchygames_ai_service.__file__];
        outside = [path for path in paths if not os.path.realpath(path).startswith(root)];
        sys.exit(str(outside) if outside else 0)
      - "{{ ai_sidecar_install_directory }}"
  environment:
    PYTHONPATH: "{{ ai_sidecar_install_directory }}/site"
  changed_when: false

- name: Find the binary and the libraries the sidecar loads
  ansible.builtin.find:
    paths: ["{{ ai_sidecar_install_directory }}/python", "{{ ai_sidecar_install_directory }}/site"]
    patterns: ["*.so", "*.so.*", "*.dylib"]
    recurse: true
  register: ai_sidecar_libraries

# A Mac's check: what otool -L lists must be the system's, or the sidecar's own
- name: List what the sidecar links on a Mac
  when: ansible_facts['system'] == 'Darwin'
  ansible.builtin.command:
    argv: [otool, -L, "{{ item }}"]
  loop: "{{ [ai_sidecar_install_directory ~ '/python/bin/python3.14'] + (ai_sidecar_libraries.files | map(attribute='path') | list) }}"
  register: ai_sidecar_otool_output
  changed_when: false
  failed_when: >-
    result.rc != 0 and not ((result.stdout ~ result.stderr) is search(ai_sidecar_not_an_object_pattern))

- name: Check that the sidecar links only its own libraries and the system frameworks
  when: ansible_facts['system'] == 'Darwin' and not ((item.stdout ~ item.stderr) is search(ai_sidecar_not_an_object_pattern))
  ansible.builtin.assert:
    # otool -L prints the file's name, and for a dylib its own install name (an absolute path)
    # as the first entry, so a dylib's entries start at the third line
    that: >-
      item.stdout_lines[(2 if item.item is search('[.]dylib$') else 1):]
      | reject('search', ai_sidecar_macos_system_link_pattern)
      | list | length == 0
    fail_msg: "{{ item.item }} links {{ item.stdout }}"
  loop: "{{ ai_sidecar_otool_output.results }}"
  loop_control:
    label: "{{ item.item }}"

# A Linux check: ldd prints a library found through an RPATH as <sidecar>/python/bin/../lib/...,
# unnormalised, so the sidecar's own libraries are matched by their prefix
- name: List what the sidecar links on Linux
  when: ansible_facts['system'] == 'Linux'
  ansible.builtin.command:
    argv: [ldd, "{{ item }}"]
  loop: "{{ [ai_sidecar_install_directory ~ '/python/bin/python3.14'] + (ai_sidecar_libraries.files | map(attribute='path') | list) }}"
  register: ai_sidecar_ldd_output
  changed_when: false
  failed_when: >-
    result.rc != 0 and not ((result.stdout ~ result.stderr) is search(ai_sidecar_not_an_object_pattern))

- name: Check that the sidecar links only its own libraries and the system libc
  when: ansible_facts['system'] == 'Linux' and not ((item.stdout ~ item.stderr) is search(ai_sidecar_not_an_object_pattern))
  ansible.builtin.assert:
    that: >-
      item.stdout_lines
      | reject('search', ai_sidecar_linux_system_link_pattern ~ '|=> ' ~ (ai_sidecar_install_directory | regex_escape) ~ '/(python|site)/')
      | list | length == 0
    fail_msg: "{{ item.item }} links {{ item.stdout }}"
  loop: "{{ ai_sidecar_ldd_output.results }}"
  loop_control:
    label: "{{ item.item }}"

# Said, not silent: these were found by name and are not objects the loader reads
- name: Say which files were skipped as not dynamic objects
  ansible.builtin.debug:
    msg: "{{ item.item }} is not a dynamic object, so its links were not checked"
  loop: "{{ ai_sidecar_otool_output.results | default([]) + ai_sidecar_ldd_output.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('') }}"
  when: >-
    item.item is defined and (item.stdout | default('') ~ item.stderr | default('')) is search(ai_sidecar_not_an_object_pattern)
