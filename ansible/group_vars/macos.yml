---
# Where the local AI service lives, for the user running it (plans/lucid-circuit.md, section 6).
# Nothing here is under the repository, or Dropbox would sync the models and the build tree.
ai_home: "{{ ansible_facts['user_dir'] }}"
# On a Mac the programs and the user's data share one folder, so every template can name the two
# without a platform test (plans/lucid-circuit-linux.md, section 6.1)
ai_program_root: "{{ ai_home }}/Library/Application Support/GlitchyGames/AI"
ai_user_root: "{{ ai_program_root }}"
ai_cache_root: "{{ ai_home }}/Library/Caches/GlitchyGames/AI"
ai_log_root: "{{ ai_home }}/Library/Logs/GlitchyGames/AI"
# Where the llama_cpp role installs a build: straight into the program folder
llama_cpp_install_root: "{{ ai_program_root }}"
# llama.cpp's own thread count: Metal does the work (plans/lucid-circuit-linux.md, 6.5)
ai_service_threads: ""
# The free space at a path, in KiB: this command, then the path, and its output's last line is
# the number alone (as on Linux, group_vars/linux.yml, where every reader is named). A Mac's df
# has no --output, and its table names the filesystem first, so a name holding a space moved the
# field (bugs/2026-11-20-free-space-read-from-the-wrong-column.md). Foundation's file manager
# gives the number (NSFileSystemFreeSize, the f_bavail statfs(2) gives), and nothing for a path
# it can't read; osascript runs it as JavaScript, with the path as its argument
ai_free_space_program: >-
  ObjC.import("Foundation"); function run(argv) { const attributes =
  $.NSFileManager.defaultManager.attributesOfFileSystemForPathError(argv[0], null); return
  attributes.isNil() ? "" : String(Math.floor(ObjC.unwrap(attributes.objectForKey(
  $.NSFileSystemFreeSize)) / 1024)); }
ai_free_space_command: [osascript, -l, JavaScript, -e, "{{ ai_free_space_program }}"]
