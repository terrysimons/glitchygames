---
# The Raspberry Pi 4 that runs CircleCI's build-and-test-raspberry-pi job
# (plans/2026-11-04-raspberry-pi-ci-runner.md). From the repository root, on another machine:
#   uvx --from ansible-core ansible-playbook -i ansible/inventory.yml \
#     ansible/raspberry_pi_runner.yml --ask-become-pass
- name: Set up the Raspberry Pi runner
  hosts: raspberry-pi-runner
  become: true
  vars:
    # Add the runner's circleci user here once machine runner 3 is installed
    raspberry_pi_video_users:
      - "{{ ansible_user }}"
    # What the owner measures by hand with (nox -s measure-staged). The CI job installs its own.
    # Keep this at .circleci/config.yml's UV_VERSION (tests/test_ci_config.py checks it)
    raspberry_pi_uv_version: "0.13.6"
    raspberry_pi_uv_path: "/home/{{ ansible_user }}/.local/bin/uv"
    # Without these, commits made here use an address built from the hostname
    raspberry_pi_git_name: "Terry Simons"
    raspberry_pi_git_email: "262790+terrysimons@users.noreply.github.com"

  tasks:
    - name: Name the host after the Ubuntu it runs
      ansible.builtin.hostname:
        name: "{{ raspberry_pi_hostname }}"

    # git and curl: checkout and the uv installer. fontconfig: the suite's text tests, explicit
    # because only the desktop brings it in today. build-essential and python3-dev: numpy has no
    # wheels in uv.lock and miniaudio none for Linux ARM on Python 3.14, so both compile
    - name: Install what the checkout, the tests and the source builds need
      ansible.builtin.apt:
        name:
          - build-essential
          - curl
          - fontconfig
          - git
          - openssh-server
          - python3-dev
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Read the installed uv version
      ansible.builtin.command:
        cmd: "{{ raspberry_pi_uv_path }} --version"
      become: true
      become_user: "{{ ansible_user }}"
      register: raspberry_pi_uv_installed
      changed_when: false
      failed_when: false

    # UV_NO_MODIFY_PATH: the shell files already source ~/.local/bin/env
    - name: Install uv at its pinned version
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail &&
          curl -LsSf https://astral.sh/uv/{{ raspberry_pi_uv_version }}/install.sh |
          UV_NO_MODIFY_PATH=1 sh
        executable: /bin/bash
      become: true
      become_user: "{{ ansible_user }}"
      changed_when: true
      when: raspberry_pi_uv_version not in (raspberry_pi_uv_installed.stdout | default(''))

    - name: Set the git identity of commits made here
      ansible.builtin.blockinfile:
        path: "/home/{{ ansible_user }}/.gitconfig"
        create: true
        mode: "0644"
        block: |
          [user]
              name = {{ raspberry_pi_git_name }}
              email = {{ raspberry_pi_git_email }}
      become: true
      become_user: "{{ ansible_user }}"

    # /dev/vcio is root:root 0600 out of the box, so no group can read it and vcgencmd fails
    - name: Give /dev/vcio to the video group
      ansible.builtin.copy:
        content: 'KERNEL=="vcio", GROUP="video", MODE="0660"'
        dest: /etc/udev/rules.d/99-vcio.rules
        owner: root
        group: root
        mode: "0644"
      notify: Apply the udev rule

    - name: Add the users who read the throttling state to the video group
      ansible.builtin.user:
        name: "{{ item }}"
        groups: video
        append: true
      loop: "{{ raspberry_pi_video_users }}"

    - name: Apply the udev rule before checking it
      ansible.builtin.meta: flush_handlers

    # sudo (become) reads the user's groups afresh, so it sees a group the task above just added
    - name: Check each user can read the throttling state
      ansible.builtin.command:
        cmd: vcgencmd get_throttled
      become: true
      become_user: "{{ item }}"
      changed_when: false
      loop: "{{ raspberry_pi_video_users }}"

  handlers:
    - name: Apply the udev rule
      ansible.builtin.shell:
        cmd: udevadm control --reload && udevadm trigger --settle --name-match=vcio
      changed_when: true
