---
all:
  vars:
    # Whether a host gets the local AI service (ansible/ai_service.yml). A host or group that
    # can't run it turns it off here, and the AI playbook then leaves that host alone. Every Pi
    # gets it (the owner, 2026-11-19): the memory tiers pick what each runs from its
    # host_memory_gb (plans/lucid-circuit-linux.md, 6.4.1), so no group or host below sets it
    ai_enabled: true
  children:
    # The Raspberry Pis (ansible/raspberry_pi_runner.yml sets each up): CircleCI machine runners
    # whose jobs no workflow runs, and the machines the pre-push hook measures replays on.
    # scripts/measure_on_raspberry_pi.py lists each host by name (its tests check the two agree).
    # Grouped by OS: what differs between OSes (clocking today) is done per group
    raspberry_pis:
      vars:
        ansible_user: terry
        ansible_python_interpreter: /usr/bin/python3
        # The runner's display: 1920x1080 at 120 Hz, the standard 1080p120 timing both boards offer
        # (a Pi 5 also offers 120.04, a Pi 4 doesn't), so all three drive the display alike; the
        # highest rate at that size if 120 isn't offered (the owner, 2026-11-14)
        raspberry_pi_display_mode:
          width: 1920
          height: 1080
          refresh_rates: [120.0]
      children:
        # Each Pi names the release it runs (raspberry_pi_os_release), its board section in
        # config.txt (raspberry_pi_board), its clock (stock, or raspberry_pi_overclock_settings
        # among the firmware role's raspberry_pi_clock_keys) and its fan (raspberry_pi_fan: its
        # kind, its GPIO pin, and levels in Celsius; an Active Cooler with no levels keeps the
        # firmware's default curve). Tests: tests/test_ansible_raspberry_pis.py
        raspberry_pis_ubuntu:
          vars:
            raspberry_pi_os: ubuntu
            # How Ansible reports it, and the releases this playbook supports
            raspberry_pi_os_distribution: Ubuntu
            raspberry_pi_os_release_fact: distribution_version
            raspberry_pi_os_supported_releases: ["26.04", "26.10"]
            # Ubuntu's firmware config (the boot partition is mounted at /boot/firmware)
            raspberry_pi_firmware_config: /boot/firmware/config.txt
          hosts:
            raspberry-pi-4-4gb-ubuntu:
              ansible_host: 172.23.23.155
              raspberry_pi_hostname: rpi4-ubuntu-2610
              # .circleci/config.yml's build-and-test-raspberry-pi-4-4gb-ubuntu names this
              # (tests/test_ci_config.py)
              raspberry_pi_resource_class: terrysimons/raspberry-pi-4-4gb-ubuntu
              raspberry_pi_description: Raspberry Pi 4 with a real display
              host_memory_gb: 4
              raspberry_pi_os_release: "26.10"
              raspberry_pi_board: pi4
              # Stock: 1800 MHz (read 2026-11-14)
              raspberry_pi_overclock_enabled: false
              raspberry_pi_overclock_settings: {}
              # No fan. History: it throttled under load with no cooling at all (get_throttled
              # 0xe0000, 2026-11-14); it has had passive heatsinks since 2026-11-20 (the owner)
              raspberry_pi_fan:
                kind: none
              # The cooling as a whole, in the requirements page's words (it may add a reading)
              raspberry_pi_cooling: Passive (heatsinks)
            # The owner's third Pi (2026-11-14): a Raspberry Pi 5 with 8 GB, on Ubuntu 26.10
            raspberry-pi-5-8gb-ubuntu:
              # Its address, not its .local name: rpi5-8gb-ubuntu-2610.local does not resolve
              # (read 2026-11-20) although avahi runs on it
              ansible_host: 172.23.23.140
              raspberry_pi_hostname: rpi5-8gb-ubuntu-2610
              # .circleci/config.yml's build-and-test-raspberry-pi-5-8gb-ubuntu names this
              # (tests/test_ci_config.py)
              raspberry_pi_resource_class: terrysimons/raspberry-pi-5-8gb-ubuntu
              raspberry_pi_description: Raspberry Pi 5 (8 GB) with a real display
              host_memory_gb: 8
              raspberry_pi_os_release: "26.10"
              raspberry_pi_board: pi5
              # Stock: 2400 MHz (read 2026-11-14)
              raspberry_pi_overclock_enabled: false
              raspberry_pi_overclock_settings: {}
              # The Active Cooler (the official cooled case) on the firmware's default curve
              raspberry_pi_fan:
                kind: active-cooler
                levels: []
              raspberry_pi_cooling: Active cooling; the official cooled case
            raspberry-pi-5-16gb-ubuntu:
              # Its address is a DHCP lease (it moved from 172.23.23.161 to 172.23.23.135 after
              # a power cut, 2026-11-20), so it is reached by its mDNS name, which the hostname
              # below keeps
              ansible_host: rpi5-ubuntu-2604.local
              raspberry_pi_hostname: rpi5-ubuntu-2604
              # .circleci/config.yml's build-and-test-raspberry-pi-5-16gb-ubuntu names this
              # (tests/test_ci_config.py)
              raspberry_pi_resource_class: terrysimons/raspberry-pi-5-16gb-ubuntu
              raspberry_pi_description: Raspberry Pi 5 (16 GB, overclocked to 3.0 GHz) with a real display
              host_memory_gb: 16
              raspberry_pi_os_release: "26.04"
              raspberry_pi_board: pi5
              # Overclocked by hand to 3000 MHz at over_voltage 6 (read 2026-11-14). The GPU's
              # 1100 MHz was typed gpu_fre, so the firmware never applied it; fixed here (the
              # owner, 2026-11-14: "Fix the typo")
              raspberry_pi_overclock_enabled: true
              raspberry_pi_overclock_settings:
                arm_freq: 3000
                gpu_freq: 1100
                over_voltage: 6
              # Its [pi5] section as typed by hand, which the block above replaces (already removed
              # by the first run, 2026-11-14; kept so a run on a restored config.txt still works)
              raspberry_pi_firmware_hand_typed_patterns:
                - '^\[pi5\]\narm_freq=3000\ngpu_fre=1100\nover_voltage=6\n\n'
              # The CPU governor, held by a systemd unit that sets every cpufreq policy at boot
              # (the firmware role; the owner, 2026-11-20: "Set the Pi 5 16GB to performance").
              # The kernel here offers conservative ondemand userspace powersave performance
              # schedutil. power-profiles-daemon is enabled on it but has only placeholder
              # balanced and power-saver profiles, so it does not touch cpufreq. A Pi that sets
              # no raspberry_pi_cpu_governor keeps whatever governor it has
              raspberry_pi_cpu_governor: performance
              # The Active Cooler on the firmware's default curve, until a measurement under
              # load says the overclock needs more (the owner, 2026-11-14)
              raspberry_pi_fan:
                kind: active-cooler
                levels: []
              # It boots from an NVMe SSD in a case that is itself a heat sink (read 2026-11-14)
              raspberry_pi_cooling: Active cooling; the NVMe case is a large heat sink
        # Raspberry Pi OS 64-bit, Trixie (the owner, 2026-11-14). Its Pis name the same host
        # variables as an Ubuntu Pi
        raspberry_pis_raspberry_pi_os:
          vars:
            raspberry_pi_os: raspberry_pi_os
            # It keeps Debian's os-release (Trixie is Debian 13); /etc/rpi-issue tells it apart
            raspberry_pi_os_distribution: Debian
            raspberry_pi_os_release_fact: distribution_major_version
            raspberry_pi_os_supported_releases: ["13"]
            raspberry_pi_os_marker_file: /etc/rpi-issue
            raspberry_pi_firmware_config: /boot/firmware/config.txt
          hosts:
            # The 8 GB Pi 5 on Raspberry Pi OS (read 2026-11-21: Raspberry Pi 5 Model B Rev 1.0,
            # Debian 13 Trixie, kernel 6.18.60+rpt-rpi-2712), on a microSD card, stock. Its host
            # comes before the 16 GB Pi's: each group's Pis are in natural order (4gb, 8gb, 16gb)
            raspberry-pi-5-8gb-raspberry-pi-os:
              # Its address is a DHCP lease (wlan0, 172.23.23.132 when read, 2026-11-21), so it is
              # reached by its mDNS name, which the hostname below keeps
              ansible_host: glitchygames-pi5-8gb-raspberry-pi-os.local
              # Its hostname as it came (spelled raspberry-pi-os, unlike the 16 GB Pi's
              # raspberrypios): the playbook names each host, and any other name would change the
              # mDNS name it is reached by
              raspberry_pi_hostname: glitchygames-pi5-8gb-raspberry-pi-os
              # .circleci/config.yml's build-and-test-raspberry-pi-5-8gb-raspberry-pi-os names
              # this (tests/test_ci_config.py); the playbook created its resource class (2026-11-22)
              raspberry_pi_resource_class: terrysimons/raspberry-pi-5-8gb-raspberry-pi-os
              raspberry_pi_description: Raspberry Pi 5 (8 GB) on Raspberry Pi OS with a real display
              host_memory_gb: 8
              raspberry_pi_os_release: "13"
              raspberry_pi_board: pi5
              # Stock: arm_freq=2400, over_voltage=0 (read 2026-11-21)
              raspberry_pi_overclock_enabled: false
              raspberry_pi_overclock_settings: {}
              # Its Active Cooler (a PWM fan, read 2026-11-21) on the firmware's default curve
              raspberry_pi_fan:
                kind: active-cooler
                levels: []
              # It boots from a 1 TB microSD card (mmcblk0, read 2026-11-21), not an NVMe SSD
              raspberry_pi_cooling: Active cooling; boots from a microSD card
            # The first Raspberry Pi OS Pi (2026-11-16): the 16 GB Pi 5 in the NVMe heat-sink
            # case, set up as the Ubuntu 16 GB Pi is (the owner: "the same sorts of corallary
            # settings that the Ubuntu system had"; plans/2026-11-04-raspberry-pi-ci-runner.md)
            raspberry-pi-5-16gb-raspberry-pi-os:
              # Its address is a DHCP lease (wlan0, read 2026-11-16), so it is reached by its
              # mDNS name, which the hostname below keeps
              ansible_host: glitchygames-pi5-16gb-raspberrypios.local
              # Its hostname as it came: the playbook names each host, and any other name would
              # change the mDNS name it is reached by
              raspberry_pi_hostname: glitchygames-pi5-16gb-raspberrypios
              # .circleci/config.yml's build-and-test-raspberry-pi-5-16gb-raspberry-pi-os names
              # this (tests/test_ci_config.py)
              raspberry_pi_resource_class: terrysimons/raspberry-pi-5-16gb-raspberry-pi-os
              raspberry_pi_description: Raspberry Pi 5 (16 GB, overclocked to 3.0 GHz) on Raspberry Pi OS with a real display
              host_memory_gb: 16
              raspberry_pi_os_release: "13"
              raspberry_pi_board: pi5
              # The Ubuntu 16 GB Pi's overclock (stock until now: read 2026-11-16). Values found
              # stable on that Pi's chip: prove them on this one under load after the first boot
              raspberry_pi_overclock_enabled: true
              raspberry_pi_overclock_settings:
                arm_freq: 3000
                gpu_freq: 1100
                over_voltage: 6
              # Its Active Cooler (a PWM fan, read 2026-11-16) on the firmware's default curve
              raspberry_pi_fan:
                kind: active-cooler
                levels: []
              # It boots from an NVMe SSD in a case that is itself a heat sink (read 2026-11-16)
              raspberry_pi_cooling: Active cooling; the NVMe case is a large heat sink
              # The performance governor, as on the Ubuntu 16 GB Pi 5 (the owner, 2026-11-20).
              # The kernel here offers conservative ondemand userspace powersave performance
              # schedutil (read 2026-11-20); power-profiles-daemon is not running on it
              raspberry_pi_cpu_governor: performance
              # Raspberry Pi OS's firmware boots it with cgroup_disable=memory, so its runner's
              # MemoryMax is not enforced; its boot arguments are left alone for now (a to-do:
              # plans/future-work.md, "The Raspberry Pi OS Pi's memory cgroup")
    # Every Linux host (group_vars/linux.yml holds where the AI service lives on one). Each states
    # its memory in host_memory_gb, from which the memory tiers pick the models it runs: the AI
    # roles never test for a board (plans/lucid-circuit-linux.md, 6.4.1 and 6.9)
    linux:
      children:
        raspberry_pis:
    macos:
      vars:
        # llama.cpp's Metal options:
        # https://github.com/ggml-org/llama.cpp/blob/b12167/ggml/CMakeLists.txt
        # https://github.com/ggml-org/llama.cpp/blob/b12167/docs/build.md
        llama_cpp_cmake_options:
          GGML_METAL: "ON"
          # Builds the shaders into the binary, so no separate shader file is installed
          GGML_METAL_EMBED_LIBRARY: "ON"
        # Passed as --n-gpu-layers: every layer runs on the GPU
        llama_cpp_gpu_layers: 99
      hosts:
        localhost:
          # Runs on this Mac directly, with no SSH, under the Python running Ansible
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
