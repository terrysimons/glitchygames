---
# The GlitchyGames local AI service on a Mac (plans/lucid-circuit.md): llama.cpp built from source
# with Metal, the models, the per-user launchd agents and the .pkg. From the repository root:
#   uvx --from ansible-core ansible-playbook -i ansible/inventory.yml ansible/macos_ai_service.yml
# One piece at a time with --tags llama_cpp (or ai_models, ai_sidecar, ai_service, ai_package). No root: this
# installs for the user running it. Running it again changes nothing unless something did.
# --tags ai_validate checks every model, and --tags ai_uninstall removes the service.
# Only hosts whose ai_enabled is true (ansible/inventory.yml) get it; the others are never contacted.
- name: Sort the hosts by whether they get the AI service
  hosts: all
  # group_by runs on the controller, so a host that is off (or unreachable) is never connected to
  gather_facts: false
  tags: [always]
  tasks:
    - name: Put each host in ai_enabled or ai_disabled
      ansible.builtin.group_by:
        key: "{{ 'ai_enabled' if ai_enabled | bool else 'ai_disabled' }}"
      changed_when: false

- name: Build and install the local AI service
  hosts: macos:&ai_enabled
  become: false
  roles:
    # Also under the later tags: they need to know which build llama_cpp installed
    - role: llama_cpp
      tags: [llama_cpp, ai_service, ai_package, ai_validate]
    - role: ai_models
      tags: [ai_models]
    # Also under the later tags: they need the sidecar in place
    - role: ai_sidecar
      tags: [ai_sidecar, ai_service, ai_package]
    # Also under ai_package: that role packages the agents this one lists
    - role: ai_service
      tags: [ai_service, ai_package]
    - role: ai_package
      tags: [ai_package]
    # Only when asked: --tags ai_validate
    - role: ai_validate
      tags: [never, ai_validate]
    # Only when asked: --tags ai_uninstall
    - role: ai_uninstall
      tags: [never, ai_uninstall]
