# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/2.0/configuration-reference
version: 2.1

# TODO:  Turn hard coded version strings into variables
# parameters:
#   action:
#     type: enum
#     enum: [build, report]
#     default: build
parameters:
  PYTHON_LATEST_VERSION:
    type: string
    default: "3.14.8"
  XCODE_LATEST_VERSION:
    type: string
    default: "27.1.0"
  # nox is installed once per job as a uv tool and run directly (no project venv; each nox
  # session syncs its own from uv.lock): keep this at the version uv.lock pins
  NOX_VERSION:
    type: string
    default: "2026.7.11"
  # uv itself, installed before anything reads uv.lock: keep this at the version uv.lock pins
  # (tests/test_ci_config.py checks both). Never the newest release unpinned: uv < 0.13.4
  # trusts a compromised CA (GHSA-hq85-5cpj-mr62)
  UV_VERSION:
    type: string
    default: "0.13.6"
  # syft and grype (nox -s security-scan: the SBOM, its CVE scan and license check), system
  # binaries rather than Python packages, so uv.lock cannot pin them. SYFT_VERSION is the syft that
  # wrote docs/sbom.cyclonedx.json (its metadata.tools, which tests/test_ci_config.py checks): a
  # different syft writes a different SBOM, and the drift check fails. Each release tarball is
  # checked against its SHA-256 below (the darwin_arm64 lines of the release's checksums.txt,
  # https://github.com/anchore/syft/releases, https://github.com/anchore/grype/releases); the scan
  # runs on the macOS job only, Apple silicon
  SYFT_VERSION:
    type: string
    default: "1.55.0"
  SYFT_DARWIN_ARM64_SHA256:
    type: string
    default: "1217c258bd5eb91ef3189cf22a82e02f9cac07e4ce934350f428e93aff674625"
  GRYPE_VERSION:
    type: string
    default: "0.121.0"
  GRYPE_DARWIN_ARM64_SHA256:
    type: string
    default: "7be39d3a0428c664ce0183e4aba31ed9accffce9eda7e7f6fa84e9c512285f27"
  # The fingerprint of the deploy key that may push gh-pages (a GitHub deploy key with write
  # access to this repository, its private half in this CircleCI project's SSH keys): the
  # deploy-docs job loads it with add_ssh_keys
  DOCS_DEPLOY_KEY_FINGERPRINT:
    type: string
    # "CircleCI docs deploy" (read-write), added 2026-10-25
    default: "SHA256:hrFdSe6hsyMQCDqSs1m1/3U9ujOZ6XJok7D7Ib41vgc"

orbs:
  win: circleci/windows@5.1.1
  macos: circleci/macos@3.0.0
  jira: circleci/jira@2.2.0
  slack: circleci/slack@6.1.3

commands:
  # One cache per OS: uv's wheel cache and its managed Python, which every nox session's
  # `uv sync --frozen` draws on. There is no project venv to cache: nox is a uv tool (installed
  # by each job, never cached: ~/.local/share/uv/tools stays out of the paths, as Windows's
  # tools directory, under %APPDATA%, does) and each session syncs its own venv from uv.lock
  # (noxfile.py)
  restore-uv-cache-posix:
    steps:
      - restore_cache:
          keys:
            - uv-cache-v2-{{ arch }}-{{ checksum "uv.lock" }}
            - uv-cache-v2-{{ arch }}-

  # Saved at the end of the job, once the nox sessions have filled it, and after
  # `uv cache prune --ci` drops what is cheaper to download again than to restore (pre-built
  # wheels), keeping what was built from source. Skipped when the key already exists
  save-uv-cache-posix:
    steps:
      - run:
          name: "Prune the uv cache"
          when: always
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            uv cache prune --ci
      - save_cache:
          key: uv-cache-v2-{{ arch }}-{{ checksum "uv.lock" }}
          when: always
          paths:
            - ~/.cache/uv
            - ~/.local/share/uv/python

  install-deps-posix:
    steps:
      - run:
          name: "Install uv and Python"
          command: |
            set -euo pipefail

            # The installer for one uv version (https://docs.astral.sh/uv/getting-started/installation/)
            curl -LsSf https://astral.sh/uv/<< pipeline.parameters.UV_VERSION >>/install.sh | sh
            export PATH="$HOME/.local/bin:$PATH"

            uv --version

            # Use the requested interpreter (download if needed on this executor); the nox
            # sessions install the project from uv.lock themselves
            uv python install "<< pipeline.parameters.PYTHON_LATEST_VERSION >>"

            # nox at the pinned version, a uv tool (its own venv; the executable in ~/.local/bin),
            # run directly by every later step. Under `uvx` the uvx process stayed alive as nox's
            # parent, about 47 MiB that the Linux job's memory guard counts
            uv tool install "nox[uv]==<< pipeline.parameters.NOX_VERSION >>"
            nox --version

  nox-format:
    steps:
      - run:
          name: "Format check"
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            nox -s format

  nox-lint:
    steps:
      - run:
          name: "Lint (ruff)"
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            nox -s lint

  nox-static-analysis:
    steps:
      - run:
          name: "Static analysis (basedpyright)"
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            nox -s static-analysis

  nox-lint-docs:
    steps:
      - run:
          name: "Lint docs (mkdocs)"
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            nox -s lint-docs

  nox-timer-report:
    steps:
      # Diagnostic only (always succeeds): whether this machine is a VM, its CPU share, and how
      # late it wakes sleeping code; the timing tests judge, this explains their numbers. The
      # nox session detects the OS itself
      - run:
          name: "Timer report (diagnostic)"
          when: always
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            nox -s timer-report

  nox-test:
    steps:
      # Tests run (and report) even when an earlier lint or format step failed, so a lint
      # failure never hides the test results. Headless: the test session defaults SDL's video
      # and audio drivers to dummy, and the Linux image has no clipboard tool, so the real
      # clipboard test checks the no-clipboard path there.
      - run:
          name: "Tests (pytest + coverage)"
          no_output_timeout: 120m
          when: always
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            nox -s test
      - store_test_results:
          path: test-results
          when: always
      - store_artifacts:
          path: test-results
          destination: test-results
          when: always
      - store_artifacts:
          path: htmlcov
          destination: coverage-html
          when: always

  # syft and grype at their pinned versions, each release tarball checked against its pinned
  # SHA-256 before anything is extracted (macOS, Apple silicon: the checksums are darwin_arm64's)
  install-supply-chain-tools-macos:
    steps:
      - run:
          name: "Install syft and grype (pinned, checksummed)"
          command: |
            set -euo pipefail
            if [ "$(uname -s) $(uname -m)" != "Darwin arm64" ]; then
              echo "The pinned syft and grype checksums are darwin_arm64's; this is $(uname -s) $(uname -m)" >&2
              exit 1
            fi
            mkdir -p "$HOME/.local/bin"
            download_directory=$(mktemp -d)
            install_release() {
              local tool="$1" version="$2" sha256="$3"
              local archive="${tool}_${version}_darwin_arm64.tar.gz"
              curl -fsSL -o "$download_directory/$archive" \
                "https://github.com/anchore/${tool}/releases/download/v${version}/${archive}"
              echo "$sha256  $download_directory/$archive" | shasum -a 256 -c -
              tar -xzf "$download_directory/$archive" -C "$download_directory" "$tool"
              install -m 0755 "$download_directory/$tool" "$HOME/.local/bin/$tool"
            }
            install_release syft "<< pipeline.parameters.SYFT_VERSION >>" "<< pipeline.parameters.SYFT_DARWIN_ARM64_SHA256 >>"
            install_release grype "<< pipeline.parameters.GRYPE_VERSION >>" "<< pipeline.parameters.GRYPE_DARWIN_ARM64_SHA256 >>"
            rm -rf "$download_directory"
            export PATH="$HOME/.local/bin:$PATH"
            syft version
            grype version

  nox-security-scan:
    steps:
      - run:
          name: "Security scan (bandit, syft SBOM, grype CVEs, licenses)"
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            nox -s security-scan

  nox-performance-test:
    steps:
      - run:
          name: "Performance benchmarks"
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            nox -s performance-test

  nox-build:
    steps:
      - run:
          name: "Build binary and wheel"
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            nox -s build
      - store_artifacts:
          path: dist
          destination: dist

  # As restore-uv-cache-posix / save-uv-cache-posix
  restore-uv-cache-windows:
    steps:
      - restore_cache:
          keys:
            - uv-cache-v2-windows-{{ checksum "uv.lock" }}
            - uv-cache-v2-windows-

  save-uv-cache-windows:
    steps:
      - run:
          name: "Prune the uv cache"
          when: always
          shell: powershell.exe
          command: |
            $ErrorActionPreference = "Stop"
            $env:PATH = "$env:USERPROFILE\.local\bin;$env:PATH"
            uv cache prune --ci
      - save_cache:
          key: uv-cache-v2-windows-{{ checksum "uv.lock" }}
          when: always
          paths:
            - C:\Users\circleci\AppData\Local\uv\cache
            - C:\Users\circleci\AppData\Local\uv\python

# Define a job to be invoked later in a workflow.
# See: https://circleci.com/docs/2.0/configuration-reference/#jobs
jobs:
  build-and-test-linux:
    # Specify the execution environment. You can specify an image from Dockerhub or use one of our Convenience Images from CircleCI's Developer Hub.
    # See: https://circleci.com/docs/2.0/configuration-reference/#docker-machine-macos-windows-executor
    docker:
      - image: cimg/python:<< pipeline.parameters.PYTHON_LATEST_VERSION >>
    # Add steps to the job
    # See: https://circleci.com/docs/2.0/configuration-reference/#steps

    # small (1 vCPU, 2 GB): one process runs the whole suite. It grew past 2 GB until the recording
    # mocks in two timing and hardware tests were replaced (BUGS.md #85)
    resource_class: small

    environment:
      DISABLE_MKDOCS_2_WARNING: "true"
      # Run the tests serially, in pytest's own process (no xdist workers; noxfile.py)
      PYTEST_WORKERS: "0"
      # Stop the run past 1600 MiB of the container's memory (its page cache left out), naming the
      # test (tests/memory_guard.py), before the 2 GB executor's kernel kills it with signal 9 and
      # no test named (BUGS.md #235). 1600 is the owner's choice (2026-10-28: "Let's stay at 1600
      # for a bit and see if we can reduce it further"); after BUGS.md #237's fixes a serial run
      # peaked at 1409 MiB (amd64 emulated in Docker; CircleCI's summary line is the real figure)
      GLITCHYGAMES_TEST_RSS_LIMIT_MB: "1600"

    steps:
      - checkout

      - run:
          name: "Install Linux system dependencies"
          command: |
            set -euo pipefail
            sudo apt-get update
            sudo apt-get install -y fontconfig

      - restore-uv-cache-posix
      - install-deps-posix
      # Only what differs by platform; format, lint, type checks, docs, security scans and
      # benchmarks give the same answer on every OS and run on macOS (the fastest runner; the
      # committed SBOM is macOS's, so its drift check runs there)
      - nox-timer-report
      - nox-test
      - nox-build
      - save-uv-cache-posix

  build-and-test-macos:
    macos:
      xcode: << pipeline.parameters.XCODE_LATEST_VERSION >>
    resource_class: m4pro.medium

    environment:
      DISABLE_MKDOCS_2_WARNING: "true"
      # The Bitmappy binary is built for this executor's architecture (arm64, Apple silicon):
      # no PYINSTALLER_TARGET_ARCH. A universal2 build needs every compiled extension fat,
      # and numpy, scipy, pandas, Pillow and pydantic-core ship arm64-only wheels for Python
      # 3.14 (PyInstaller then fails: "... is not a fat binary!"; it does not fall back)

    steps:
      - checkout

      - restore-uv-cache-posix
      - install-deps-posix
      - nox-format
      - nox-lint
      - nox-static-analysis
      - nox-lint-docs
      - nox-timer-report
      - nox-test
      - install-supply-chain-tools-macos
      - nox-security-scan
      - nox-performance-test
      - nox-build
      - save-uv-cache-posix

  build-and-test-windows:
    executor:
      name: win/default
      size: medium

    environment:
      DISABLE_MKDOCS_2_WARNING: "true"

    steps:
      - checkout

      - restore-uv-cache-windows
      - run:
          name: "Install uv and Python"
          shell: powershell.exe
          command: |
            $ErrorActionPreference = "Stop"

            # Install uv: the installer for one uv version
            # (https://docs.astral.sh/uv/getting-started/installation/)
            irm https://astral.sh/uv/<< pipeline.parameters.UV_VERSION >>/install.ps1 | iex
            $env:PATH = "$env:USERPROFILE\.local\bin;$env:PATH"

            uv --version

            # The nox sessions install the project from uv.lock themselves
            uv python install "<< pipeline.parameters.PYTHON_LATEST_VERSION >>"

            # nox at the pinned version, a uv tool run directly, as in install-deps-posix
            uv tool install "nox[uv]==<< pipeline.parameters.NOX_VERSION >>"
            nox --version
      # Only what differs by platform, as on Linux; the rest runs on macOS
      # Diagnostic only, as in nox-timer-report
      - run:
          name: "Timer report (diagnostic)"
          when: always
          shell: powershell.exe
          command: |
            $ErrorActionPreference = "Stop"
            $env:PATH = "$env:USERPROFILE\.local\bin;$env:PATH"
            nox -s timer-report
      # Tests run (and report) even when an earlier step failed, as in nox-test
      - run:
          name: "Tests (pytest + coverage)"
          no_output_timeout: 120m
          when: always
          shell: powershell.exe
          command: |
            $ErrorActionPreference = "Stop"
            $env:PATH = "$env:USERPROFILE\.local\bin;$env:PATH"
            nox -s test
      - store_test_results:
          path: test-results
          when: always
      - store_artifacts:
          path: test-results
          destination: test-results
          when: always
      - store_artifacts:
          path: htmlcov
          destination: coverage-html
          when: always
      - run:
          name: "Build binary and wheel"
          shell: powershell.exe
          command: |
            $ErrorActionPreference = "Stop"
            $env:PATH = "$env:USERPROFILE\.local\bin;$env:PATH"
            nox -s build
      - store_artifacts:
          path: dist
          destination: dist
      - save-uv-cache-windows


  # Publishes the docs (https://terrysimons.github.io/glitchygames/, the gh-pages branch) after
  # a merge to main: nox -s docs-deploy, browser games (play/) included, without measuring the
  # replays (CI machines vary; their timings would be noise in the run ledger). On macOS, the
  # fastest job: it starts as soon as macOS passes, alongside the Linux and Windows jobs
  deploy-docs:
    macos:
      xcode: << pipeline.parameters.XCODE_LATEST_VERSION >>
    resource_class: m4pro.medium

    environment:
      DISABLE_MKDOCS_2_WARNING: "true"

    steps:
      - checkout
      # Publish what main is now, not only the commit this deploy was started for: a merge that
      # landed while this deploy waited its turn (serial-group) is published here instead of
      # depending on its own deploy, which may be canceled. A deploy whose main is already on
      # gh-pages (MkDocs commits "Deployed <short hash> with MkDocs ...") stops, successfully
      - run:
          name: "Move to main's latest commit; stop if its docs are already published"
          command: |
            set -euo pipefail
            git fetch --quiet origin main gh-pages
            git checkout --quiet --detach origin/main
            latest=$(git rev-parse HEAD)
            published=$(git log -1 --format=%s origin/gh-pages \
              | sed -n 's/^Deployed \([0-9a-f]\{7,\}\) with MkDocs.*/\1/p')
            echo "main is at $latest; gh-pages holds ${published:-an unrecognised deploy}"
            case "$latest" in
              "${published:-none}"*)
                echo "main's docs are already published: nothing to deploy"
                circleci-agent step halt
                ;;
            esac
      - run:
          name: "Check out the pygame-ce submodule (the browser games' wheel is built from it)"
          command: |
            set -euo pipefail
            git submodule update --init third_party/pygame-ce
            git -C third_party/pygame-ce rev-parse HEAD > .pygame-ce-commit
      - add_ssh_keys:
          fingerprints:
            - "<< pipeline.parameters.DOCS_DEPLOY_KEY_FINGERPRINT >>"
      - restore-uv-cache-posix
      # The Pyodide toolchain (about 2 GB; pinned in the build script) and the wheel it built
      # from the submodule's commit (scripts/build_browser_bundle.py reuses it when
      # dist-pyodide/build-info.json names that commit)
      - restore_cache:
          keys:
            - pyodide-toolchain-v1-{{ arch }}-{{ checksum "third_party/pygame-ce/buildconfig/glitchygames/build_pyodide_wheel.sh" }}
      - restore_cache:
          keys:
            - pygame-ce-pyodide-wheel-v1-{{ checksum ".pygame-ce-commit" }}
      - install-deps-posix
      - run:
          name: "Deploy the docs (nox -s docs-deploy -- --no-measure)"
          no_output_timeout: 60m
          command: |
            set -euo pipefail
            export PATH="$HOME/.local/bin:$PATH"
            git config user.name "CircleCI docs deploy"
            git config user.email "docs-deploy@circleci.invalid"
            # Push with the deploy key: CircleCI's checkout key is read-only and is offered
            # first otherwise. add_ssh_keys writes ~/.ssh/id_<type>_<fingerprint>
            deploy_key=$(find ~/.ssh -maxdepth 1 -type f -name 'id_*_*' ! -name '*.pub' | head -1)
            if [ -z "$deploy_key" ]; then
              echo "No deploy key from add_ssh_keys in ~/.ssh: is DOCS_DEPLOY_KEY_FINGERPRINT set?" >&2
              ls -la ~/.ssh >&2
              exit 1
            fi
            export GIT_SSH_COMMAND="ssh -i $deploy_key -o IdentitiesOnly=yes"
            nox -s docs-deploy -- --no-measure
      - save_cache:
          key: pyodide-toolchain-v1-{{ arch }}-{{ checksum "third_party/pygame-ce/buildconfig/glitchygames/build_pyodide_wheel.sh" }}
          paths:
            - ~/.cache/glitchygames-pyodide-build
      - save_cache:
          key: pygame-ce-pyodide-wheel-v1-{{ checksum ".pygame-ce-commit" }}
          paths:
            - third_party/pygame-ce/dist-pyodide
      - save-uv-cache-posix

  # Tests the website's CDK app, publisher and CloudFront Function (infra/; nox -s infra-test).
  # The -node image: the CDK's Python library runs on Node, and the function's tests use node
  test-infra:
    docker:
      - image: cimg/python:<< pipeline.parameters.PYTHON_LATEST_VERSION >>-node
    resource_class: small

    steps:
      - checkout
      - restore-uv-cache-posix
      - install-deps-posix
      - run:
          name: "Test the website's infrastructure (nox -s infra-test)"
          command: |
            set -euo pipefail
            export PATH="$HOME/.local/bin:$PATH"
            uvx --from "nox[uv]==<< pipeline.parameters.NOX_VERSION >>" nox -s infra-test
      - save-uv-cache-posix

  # Publishes play.glitchy.games after a merge to main: the website (src/website) to the
  # site's bucket, then a CloudFront invalidation (nox -s site-publish; docs/specs/
  # 2026-10-27-glitchy-games-website-design.md, Publishing). It signs in to AWS with this job's
  # OIDC token: boto3 assumes AWS_ROLE_ARN with the token in AWS_WEB_IDENTITY_TOKEN_FILE. The
  # role's ARN names the AWS account, so it is the project environment variable
  # SITE_DEPLOY_ROLE_ARN (CircleCI Project Settings), never written in this public file (the
  # owner, 2026-10-28): the GlitchyGamesSiteDeployRole stack's DeployRoleArn output
  deploy-site:
    docker:
      - image: cimg/python:<< pipeline.parameters.PYTHON_LATEST_VERSION >>
    resource_class: small

    environment:
      AWS_REGION: us-east-1

    steps:
      - checkout
      - restore-uv-cache-posix
      - install-deps-posix
      - run:
          name: "Publish the site (nox -s site-publish)"
          command: |
            set -euo pipefail
            export PATH="$HOME/.local/bin:$PATH"
            role_arn="${SITE_DEPLOY_ROLE_ARN:-}"
            if [ -z "$role_arn" ]; then
              echo "SITE_DEPLOY_ROLE_ARN is not set: add it in CircleCI's Project Settings > Environment Variables, set to the GlitchyGamesSiteDeployRole stack's DeployRoleArn output" >&2
              exit 1
            fi
            token_file="$(mktemp)"
            printf '%s' "$CIRCLE_OIDC_TOKEN_V2" > "$token_file"
            export AWS_ROLE_ARN="$role_arn"
            export AWS_WEB_IDENTITY_TOKEN_FILE="$token_file"
            uvx --from "nox[uv]==<< pipeline.parameters.NOX_VERSION >>" nox -s site-publish
      - save-uv-cache-posix

# Invoke jobs via workflows
# See: https://circleci.com/docs/2.0/configuration-reference/#workflows
workflows:
  build-and-test:
    jobs:
      - build-and-test-linux
      - build-and-test-macos
      - build-and-test-windows
      # After a merge to main: as soon as the macOS job passes (the same tree passed all three in
      # its pull request), one deploy at a time so two quick merges cannot race gh-pages
      - deploy-docs:
          requires:
            - build-and-test-macos
          filters:
            branches:
              only: main
          serial-group: << pipeline.project.slug >>/deploy-docs
      - test-infra
      # After a merge to main, once the docs have published (deploy-docs, which waits for macOS)
      # and the infra tests pass (the owner, 2026-10-28: "it should run on main after docs
      # publish"); one deploy at a time. The deploy role itself trusts only main's jobs (the
      # OIDC token's vcs-ref; infra/src/glitchy_site/deploy_role_stack.py): this filter just
      # skips running it elsewhere
      - deploy-site:
          requires:
            - deploy-docs
            - test-infra
          filters:
            branches:
              only: main
          serial-group: << pipeline.project.slug >>/deploy-site
