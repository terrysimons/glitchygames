# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/2.0/configuration-reference
version: 2.1

# TODO:  Turn hard coded version strings into variables
# parameters:
#   action:
#     type: enum
#     enum: [build, report]
#     default: build
parameters:
  PYTHON_LATEST_VERSION:
    type: string
    default: "3.14.8"
  XCODE_LATEST_VERSION:
    type: string
    default: "27.1.0"
  # nox runs through uvx (no project venv; each nox session syncs its own from uv.lock):
  # keep this at the version uv.lock pins
  NOX_VERSION:
    type: string
    default: "2026.7.11"

orbs:
  win: circleci/windows@5.1.1
  macos: circleci/macos@3.0.0
  jira: circleci/jira@2.2.0
  slack: circleci/slack@6.1.3

commands:
  # One cache per OS: uv's wheel cache and its managed Python, which every nox session's
  # `uv sync --frozen` draws on. There is no project venv to cache: nox runs through uvx and
  # each session syncs its own venv from uv.lock (noxfile.py)
  restore-uv-cache-posix:
    steps:
      - restore_cache:
          keys:
            - uv-cache-v2-{{ arch }}-{{ checksum "uv.lock" }}
            - uv-cache-v2-{{ arch }}-

  # Saved at the end of the job, once the nox sessions have filled it, and after
  # `uv cache prune --ci` drops what is cheaper to download again than to restore (pre-built
  # wheels), keeping what was built from source. Skipped when the key already exists
  save-uv-cache-posix:
    steps:
      - run:
          name: "Prune the uv cache"
          when: always
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            uv cache prune --ci
      - save_cache:
          key: uv-cache-v2-{{ arch }}-{{ checksum "uv.lock" }}
          when: always
          paths:
            - ~/.cache/uv
            - ~/.local/share/uv

  install-deps-posix:
    steps:
      - run:
          name: "Install uv and Python"
          command: |
            set -euo pipefail

            curl -LsSf https://astral.sh/uv/install.sh | sh
            export PATH="$HOME/.local/bin:$PATH"

            uv --version

            # Use the requested interpreter (download if needed on this executor); the nox
            # sessions install the project from uv.lock themselves
            uv python install "<< pipeline.parameters.PYTHON_LATEST_VERSION >>"

  nox-format:
    steps:
      - run:
          name: "Format check"
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            uvx --from "nox[uv]==<< pipeline.parameters.NOX_VERSION >>" nox -s format

  nox-lint:
    steps:
      - run:
          name: "Lint (ruff)"
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            uvx --from "nox[uv]==<< pipeline.parameters.NOX_VERSION >>" nox -s lint

  nox-static-analysis:
    steps:
      - run:
          name: "Static analysis (basedpyright)"
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            uvx --from "nox[uv]==<< pipeline.parameters.NOX_VERSION >>" nox -s static-analysis

  nox-lint-docs:
    steps:
      - run:
          name: "Lint docs (mkdocs)"
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            uvx --from "nox[uv]==<< pipeline.parameters.NOX_VERSION >>" nox -s lint-docs

  nox-timer-report:
    steps:
      # Diagnostic only (always succeeds): whether this machine is a VM, its CPU share, and how
      # late it wakes sleeping code; the timing tests judge, this explains their numbers. The
      # nox session detects the OS itself
      - run:
          name: "Timer report (diagnostic)"
          when: always
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            uvx --from "nox[uv]==<< pipeline.parameters.NOX_VERSION >>" nox -s timer-report

  nox-test:
    steps:
      # Tests run (and report) even when an earlier lint or format step failed, so a lint
      # failure never hides the test results. Headless: the test session defaults SDL's video
      # and audio drivers to dummy, and the Linux image has no clipboard tool, so the real
      # clipboard test checks the no-clipboard path there.
      - run:
          name: "Tests (pytest + coverage)"
          no_output_timeout: 120m
          when: always
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            uvx --from "nox[uv]==<< pipeline.parameters.NOX_VERSION >>" nox -s test
      - store_test_results:
          path: test-results
          when: always
      - store_artifacts:
          path: test-results
          destination: test-results
          when: always
      - store_artifacts:
          path: htmlcov
          destination: coverage-html
          when: always

  nox-security-scan:
    steps:
      - run:
          name: "Security scan (bandit + safety)"
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            uvx --from "nox[uv]==<< pipeline.parameters.NOX_VERSION >>" nox -s security-scan

  nox-performance-test:
    steps:
      - run:
          name: "Performance benchmarks"
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            uvx --from "nox[uv]==<< pipeline.parameters.NOX_VERSION >>" nox -s performance-test

  nox-build:
    steps:
      - run:
          name: "Build binary and wheel"
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            uvx --from "nox[uv]==<< pipeline.parameters.NOX_VERSION >>" nox -s build
      - store_artifacts:
          path: dist
          destination: dist

  # As restore-uv-cache-posix / save-uv-cache-posix
  restore-uv-cache-windows:
    steps:
      - restore_cache:
          keys:
            - uv-cache-v2-windows-{{ checksum "uv.lock" }}
            - uv-cache-v2-windows-

  save-uv-cache-windows:
    steps:
      - run:
          name: "Prune the uv cache"
          when: always
          shell: powershell.exe
          command: |
            $ErrorActionPreference = "Stop"
            $env:PATH = "$env:USERPROFILE\.local\bin;$env:PATH"
            uv cache prune --ci
      - save_cache:
          key: uv-cache-v2-windows-{{ checksum "uv.lock" }}
          when: always
          paths:
            - C:\Users\circleci\AppData\Local\uv\cache
            - C:\Users\circleci\AppData\Local\uv\python

# Define a job to be invoked later in a workflow.
# See: https://circleci.com/docs/2.0/configuration-reference/#jobs
jobs:
  build-and-test-linux:
    # Specify the execution environment. You can specify an image from Dockerhub or use one of our Convenience Images from CircleCI's Developer Hub.
    # See: https://circleci.com/docs/2.0/configuration-reference/#docker-machine-macos-windows-executor
    docker:
      - image: cimg/python:<< pipeline.parameters.PYTHON_LATEST_VERSION >>
    # Add steps to the job
    # See: https://circleci.com/docs/2.0/configuration-reference/#steps

    # small (1 vCPU, 2 GB): one process runs the whole suite. It grew past 2 GB until the recording
    # mocks in two timing and hardware tests were replaced (BUGS.md #85)
    resource_class: small

    environment:
      DISABLE_MKDOCS_2_WARNING: "true"
      # Run the tests serially, in pytest's own process (no xdist workers; noxfile.py)
      PYTEST_WORKERS: "0"

    steps:
      - checkout

      - run:
          name: "Install Linux system dependencies"
          command: |
            set -euo pipefail
            sudo apt-get update
            sudo apt-get install -y fontconfig

      - restore-uv-cache-posix
      - install-deps-posix
      # Only what differs by platform; format, lint, type checks, docs, security scans and
      # benchmarks give the same answer on every OS and run on macOS (the fastest runner)
      - nox-timer-report
      - nox-test
      - nox-build
      - save-uv-cache-posix

  build-and-test-macos:
    macos:
      xcode: << pipeline.parameters.XCODE_LATEST_VERSION >>
    resource_class: m4pro.medium

    environment:
      DISABLE_MKDOCS_2_WARNING: "true"
      # The Bitmappy binary is built for this executor's architecture (arm64, Apple silicon):
      # no PYINSTALLER_TARGET_ARCH. A universal2 build needs every compiled extension fat,
      # and numpy, scipy, pandas, Pillow and pydantic-core ship arm64-only wheels for Python
      # 3.14 (PyInstaller then fails: "... is not a fat binary!"; it does not fall back)

    steps:
      - checkout

      - restore-uv-cache-posix
      - install-deps-posix
      - nox-format
      - nox-lint
      - nox-static-analysis
      - nox-lint-docs
      - nox-timer-report
      - nox-test
      - nox-security-scan
      - nox-performance-test
      - nox-build
      - save-uv-cache-posix

  build-and-test-windows:
    executor:
      name: win/default
      size: medium

    environment:
      DISABLE_MKDOCS_2_WARNING: "true"

    steps:
      - checkout

      - restore-uv-cache-windows
      - run:
          name: "Install uv and Python"
          shell: powershell.exe
          command: |
            $ErrorActionPreference = "Stop"

            # Install uv
            irm https://astral.sh/uv/install.ps1 | iex
            $env:PATH = "$env:USERPROFILE\.local\bin;$env:PATH"

            uv --version

            # The nox sessions install the project from uv.lock themselves
            uv python install "<< pipeline.parameters.PYTHON_LATEST_VERSION >>"
      # Only what differs by platform, as on Linux; the rest runs on macOS
      # Diagnostic only, as in nox-timer-report
      - run:
          name: "Timer report (diagnostic)"
          when: always
          shell: powershell.exe
          command: |
            $ErrorActionPreference = "Stop"
            $env:PATH = "$env:USERPROFILE\.local\bin;$env:PATH"
            uvx --from "nox[uv]==<< pipeline.parameters.NOX_VERSION >>" nox -s timer-report
      # Tests run (and report) even when an earlier step failed, as in nox-test
      - run:
          name: "Tests (pytest + coverage)"
          no_output_timeout: 120m
          when: always
          shell: powershell.exe
          command: |
            $ErrorActionPreference = "Stop"
            $env:PATH = "$env:USERPROFILE\.local\bin;$env:PATH"
            uvx --from "nox[uv]==<< pipeline.parameters.NOX_VERSION >>" nox -s test
      - store_test_results:
          path: test-results
          when: always
      - store_artifacts:
          path: test-results
          destination: test-results
          when: always
      - store_artifacts:
          path: htmlcov
          destination: coverage-html
          when: always
      - run:
          name: "Build binary and wheel"
          shell: powershell.exe
          command: |
            $ErrorActionPreference = "Stop"
            $env:PATH = "$env:USERPROFILE\.local\bin;$env:PATH"
            uvx --from "nox[uv]==<< pipeline.parameters.NOX_VERSION >>" nox -s build
      - store_artifacts:
          path: dist
          destination: dist
      - save-uv-cache-windows


# Invoke jobs via workflows
# See: https://circleci.com/docs/2.0/configuration-reference/#workflows
workflows:
  build-and-test:
    jobs:
      - build-and-test-linux:
          context:
            - SAFETY_API_KEY
      - build-and-test-macos:
          context:
            - SAFETY_API_KEY
      - build-and-test-windows:
          context:
            - SAFETY_API_KEY
