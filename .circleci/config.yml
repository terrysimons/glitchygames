# The setup configuration: it only chooses which tests the pipeline runs, then continues with
# .circleci/continue_config.yml, which holds every job and workflow (CircleCI's dynamic
# configuration, on in the project's settings).
# See: https://circleci.com/docs/guides/orchestrate/dynamic-config/
#
# A branch whose change is Markdown only (scripts/ci_change_scope.py: every changed path matches
# the pre-commit hooks' Markdown exclude) gets test-scope markdown: the test jobs and
# checks-linux are left out and the Markdown checks run instead (the owner, 2026-11-20:
# docs-only pull requests skip the test jobs). Main, a tag, any other change, or a change the script can't read gets test-scope all.
# The choice runs before anything is installed: Python's standard library, git, and the curl
# and jq the continuation needs, all in cimg/python (tests/test_ci_config.py holds the image to
# continue_config.yml's PYTHON_VERSION).
version: 2.1
setup: true

orbs:
  continuation: circleci/continuation@2.0.1

jobs:
  choose-what-runs:
    docker:
      - image: cimg/python:3.15.2
    resource_class: small
    steps:
      - checkout
      - run:
          name: "Choose the tests: all, or the Markdown checks for a Markdown-only change"
          command: |
            set -euo pipefail
            git fetch --quiet origin main
            # The branch's change since it left main, both sides of a rename; no list when git
            # can't find the merge-base (which runs everything)
            if base=$(git merge-base origin/main HEAD); then
              git diff --name-only --no-renames "$base" HEAD > /tmp/changed-paths.txt
            else
              rm -f /tmp/changed-paths.txt
            fi
            python3 scripts/ci_change_scope.py --paths /tmp/changed-paths.txt \
              --output /tmp/pipeline-parameters.json
      - continuation/continue:
          configuration_path: .circleci/continue_config.yml
          parameters: /tmp/pipeline-parameters.json

workflows:
  choose-what-runs:
    jobs:
      - choose-what-runs
