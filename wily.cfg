[wily]
# Analyze all source directories
path = src/glitchygames,src/games/mr-muncher,src/games/brave-adventurer,src/games/clockwork-keep,tests,scripts

# Use all available operators
operators = cyclomatic,maintainability,raw,halstead

# Number of git revisions to analyze
max_revisions = 50

# Enable Jupyter notebook support
ipynb_support = false
