[project]
name = "glitchygames"
version = "1.0.0"
description = "Glitchy Games and Tools for Pygame and Python 3"
authors = [
  { name = "Terry Simons", email = "terry.simons@gmail.com" },
  { name = "Rich Saupe", email = "sabadam32@gmail.com" },
]
maintainers = [
  { name = "Terry Simons", email = "terry.simons@gmail.com" },
  { name = "Rich Saupe", email = "sabadam32@gmail.com" },
]
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.14,<4.0"
classifiers = [
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
]
keywords = ["pygame", "game-engine", "pixel-art", "sprite-editor"]
dependencies = [
  "tomli-w",
  "pygame-ce",
  "pyperclip",
  # Every aisuite provider but `google` (its Vertex AI shim, vertexai 1.71.1, is no longer
  # published and pins google-cloud-aiplatform to 1.71.1[all], an extra that release lacks).
  # Google's models stay reachable through the `gemini` provider. The model is a run-time
  # setting ('provider:model'), so every other provider stays installable as with [all]
  "aisuite[anthropic,aws,cerebras,cohere,deepgram,deepseek,gemini,groq,lmstudio,mcp,mistral,ollama,openai,watsonx]>=0.1.14",
  "numpy",
  "miniaudio",
  "speechrecognition",
  "bokeh",
  "fastapi",
  "uvicorn",
  "pydantic",
  "httpx",
  "apng",
  "pillow",
  "hidapi>=0.15.0",
]

[project.urls]
"Bug Tracker" = "https://github.com/terrysimons/glitchygames/issues/"
"Homepage" = "https://glitchygames.ai/"
"Documentation" = "https://glitchygames.ai/documentation/"
"Repository" = "https://github.com/terrysimons/glitchygames"

[project.scripts]
glitchygames-server = "glitchygames.api.main:run"
glitchygames-client = "glitchygames.api.client:run"
# The engine's recording, replay and measurement tools (glitchygames/replay/tools/command.py),
# started through glitchygames/__main__.py, which hides pygame's banner first
glitchygames = "glitchygames.__main__:main"

# The golden-replay pytest plugin (glitchygames/testing/replays.py) registers itself: any project
# with glitchygames installed has its fixtures/replays/ recordings collected with no conftest
# line. It imports neither the engine nor pygame until it finds a recording, so a project that is
# no game gets no item and no output from it. Named after its module, not `glitchygames`: a
# project that still loads it by name (`-p glitchygames.testing.replays`, or `pytest_plugins`)
# then loads it once (pytest refuses one module registered under two names).
# `-p no:glitchygames.testing.replays` turns it off
[project.entry-points.pytest11]
"glitchygames.testing.replays" = "glitchygames.testing.replays"

[project.optional-dependencies]
docs = [
  "mkdocs",
  "mkdocstrings[crystal,python]",
  "mkdocs-material",
  "mkdocs-gen-files",
  "mkdocs-literate-nav",
  "mkdocs-section-index",
  "pymdown-extensions",
  "mkdocs-autorefs",
  "mkdocs-macros-plugin",
  "mkdocstrings-python",
]
dev = [
  "nox[uv]",
  # Capped at 9.1.1 (the owner, 2026-10-28): pytest 9.2.0 removed the private Node._nodeid,
  # which pytest-benchmark 5.3.0 (the newest) still reads, so every benchmark test errors at
  # setup. Lift the cap once a pytest-benchmark release works with 9.2
  "pytest<=9.1.1",
  "pytest-cov",
  "pytest-xdist",
  "pytest-benchmark",
  "pytest-mock",
  # bandit scans our code; the dependencies' CVEs and licenses are scanned by syft and grype,
  # system binaries outside this environment (nox -s security-scan, .grype.yaml,
  # scripts/check_licenses.py). safety and pip-audit were dropped for them (the owner,
  # 2026-10-28): safety pinned filelock below 4 (3.8.1 requires filelock<4, so the lock held
  # safety at 3.2.3 and forked filelock on Python 3.15), and grype covers what pip-audit did
  "bandit",
  "ruff",
  "pre-commit",
  "basedpyright",
  "ty",
  "pillow",
  "pyinstaller",
  # Lint and test tools (run from nox; never imported by the game)
  "deptry>=0.25.1",
  "vulture>=2.15",
  "hypothesis>=6.151.9",
  "taplo>=0.9.3",
  "yamllint>=1.38.0",
  # wily 2 is an alpha (2.0.0a1) that drops radon; the complexity graphs run both
  "wily>=1.25.0,<2",
  "radon>=5.1.0",
  # The complexity graphs' generation lock (scripts/generate_complexity_graphs.py, BUGS.md #214)
  "filelock>=3.32.7",
  # uv.lock's dependency markers and package names (scripts/generate_sbom.py)
  "packaging>=26.0",
]
api = []
# Building a new game project from a template (glitchygames.templates, scripts/create.py):
# `pip install glitchygames[templates]`. Optional, as only the templates use it; without it
# templates.build() raises TemplatesUnavailableError naming this extra
templates = ["cookiecutter"]
# The workspace members by layer (src/<layer>/<member>/, docs/architecture/game_packages.md):
# `pip install glitchygames[games]` installs the engine and every game. Each member depends on
# glitchygames, so these are a cycle through an extra, which pip and uv both resolve. Kept equal
# to the workspace by tests/test_workspace_config.py; an empty layer would be an empty extra
games = [
  "mr-muncher",
  "brave-adventurer",
  "clockwork-keep",
  "paddleslap",
  "drawing-fire",
]
demos = ["dt-demo", "joystick-demo", "text-input-demo"]
apps = ["bitmappy"]

[tool.uv.workspace]
# Each a package of its own beside the engine, under src/<layer>/
# (plans/2026-10-24-workspace-packages.md); listed one by one, never by glob
members = [
  "src/games/mr-muncher",
  "src/games/brave-adventurer",
  "src/games/clockwork-keep",
  "src/games/paddleslap",
  "src/games/drawing-fire",
  "src/demos/dt-demo",
  "src/demos/joystick-demo",
  "src/demos/text-input-demo",
  "src/apps/bitmappy",
]

[tool.uv.sources]
# Each member from the workspace, never from an index (the dev group below)
mr-muncher = { workspace = true }
brave-adventurer = { workspace = true }
clockwork-keep = { workspace = true }
paddleslap = { workspace = true }
drawing-fire = { workspace = true }
dt-demo = { workspace = true }
joystick-demo = { workspace = true }
text-input-demo = { workspace = true }
bitmappy = { workspace = true }

[dependency-groups]
# Every workspace member: `uv sync` installs the dev group and is exact, so without the members
# here a plain `uv sync` uninstalls what `--all-packages` installed, console scripts included,
# and the replay-metrics hook can no longer replay their recordings. Checked against the
# workspace by tests/test_workspace_config.py
dev = [
  "mr-muncher",
  "brave-adventurer",
  "clockwork-keep",
  "paddleslap",
  "drawing-fire",
  "dt-demo",
  "joystick-demo",
  "text-input-demo",
  "bitmappy",
]

[tool.hatch.build]
# The build stamp is gitignored (hatch leaves ignored files out); nox -s build-wheel and
# build-binary write it before building (glitchygames/build_info.py)
artifacts = ["src/glitchygames/_build_info.json"]

[tool.hatch.build.targets.wheel]
# The engine's source is under src/ (the user, 2026-10-25), its wheel holds glitchygames/ at
# the top level as before
packages = ["src/glitchygames"]

# The engine's recording, replay and measurement tools read this project's layout from here
# (glitchygames/replay/tools/settings.py; a project without this table gets the defaults there)
[tool.glitchygames]
# Every workspace member's console script: the five games, the three demos and Bitmappy
games = [
  "bitmappy",
  "brave-adventurer",
  "clockwork-keep",
  "drawing-fire",
  "dt-demo",
  "joystick-demo",
  "mr-muncher",
  "paddleslap",
  "text-input-demo",
]
# Each member's golden replays, directly in its tests/fixtures/replays/ (src/<layer>/<member>/)
golden-globs = ["src/*/*/tests/fixtures/replays/golden*.jsonl.gz"]
# The measured rows, one file per row (plans/2026-10-25-measured-rows-in-the-repository.md);
# not a measured path, so never part of a code tree
ledger-directory = "quality/replay-ledger"
# Where measured rows wait for a deploy to publish them (gitignored)
pending-ledger = "test-results/replay-metrics/pending.jsonl"
# Where the docs site publishes the ledger: docs/<this path> in the docs tree, on gh-pages
published-ledger = "origin/gh-pages:quality/metrics/replay-ledger.jsonl"
# The branch whose commits count as landed (the remote-tracking ref of the shared main)
landed-ref = "origin/main"
# What can change how the golden replays run: the only paths a code tree holds. src/ holds the
# engine and every workspace member (games, demos, apps: plans/2026-10-24-workspace-packages.md)
measured-paths = ["src", "tests/fixtures/replays", "uv.lock", "pyproject.toml"]
# Under src/, a workspace member's tests (src/<layer>/<member>/tests/) are not measured, but for
# its recordings there (the root's tests/ is outside measured-paths; its tests/fixtures/replays
# is in). One pair per layer (glitchygames.logical_names.LAYERS)
unmeasured-paths = [
  ":(glob)src/games/*/tests/**",
  ":(glob)src/demos/*/tests/**",
  ":(glob)src/apps/*/tests/**",
  ":(exclude,glob)src/games/*/tests/fixtures/replays/**",
  ":(exclude,glob)src/demos/*/tests/fixtures/replays/**",
  ":(exclude,glob)src/apps/*/tests/fixtures/replays/**",
]

# Recordings that moved, old repository path -> new: their ledger rows from before the move are
# the same series (performance graphs group by the new path), so a recording's history continues
# across its move (plans/2026-10-24-workspace-packages.md). The rally demo moved three times
# (into src/, into its member, then under the member's src/): a line from each old path, every
# one straight to the final path
[tool.glitchygames.recording-renames]
"glitchygames/examples/paddleslap_demos/rally.jsonl.gz" = "src/games/paddleslap/src/paddleslap/demos/rally.jsonl.gz"
"src/glitchygames/examples/paddleslap_demos/rally.jsonl.gz" = "src/games/paddleslap/src/paddleslap/demos/rally.jsonl.gz"
"src/games/paddleslap/paddleslap/demos/rally.jsonl.gz" = "src/games/paddleslap/src/paddleslap/demos/rally.jsonl.gz"
"tests/fixtures/replays/mr-muncher/golden.jsonl.gz" = "src/games/mr-muncher/tests/fixtures/replays/golden.jsonl.gz"
"tests/fixtures/replays/brave-adventurer/golden.jsonl.gz" = "src/games/brave-adventurer/tests/fixtures/replays/golden-classic.jsonl.gz"
"tests/fixtures/replays/brave-adventurer-papyrus/golden.jsonl.gz" = "src/games/brave-adventurer/tests/fixtures/replays/golden-papyrus.jsonl.gz"
"tests/fixtures/replays/clockwork-keep/golden.jsonl.gz" = "src/games/clockwork-keep/tests/fixtures/replays/golden.jsonl.gz"
"tests/fixtures/replays/paddleslap/golden.jsonl.gz" = "src/games/paddleslap/tests/fixtures/replays/golden.jsonl.gz"
"tests/fixtures/replays/drawing-fire/golden.jsonl.gz" = "src/games/drawing-fire/tests/fixtures/replays/golden.jsonl.gz"

[tool.pytest.ini_options]
testpaths = [
  "tests",
  "src/games/mr-muncher/tests",
  "src/games/brave-adventurer/tests",
  "src/games/clockwork-keep/tests",
  "src/games/paddleslap/tests",
  "src/games/drawing-fire/tests",
  "src/demos/dt-demo/tests",
  "src/demos/joystick-demo/tests",
  "src/demos/text-input-demo/tests",
  "src/apps/bitmappy/tests",
]
python_files = ["test_*.py"]
# Every test module is imported under a name made from its path from the repository root
# (importlib mode: src.apps.bitmappy.tests.test_bitmappy_film_strip, tests.replay.test_x), never
# under its bare file name: two members may have test files or helpers of the same name (the
# user, 2026-10-27: "we can't really control what a game calls its files"). Namespace packages
# are not considered: with them the name would follow sys.path, which an editable engine install
# changes (apps.bitmappy.tests...), so a module would get another name in another environment.
# Nothing is put on sys.path for a test directory; the repository root is, so a member's helper
# is imported by that same path (src.apps.bitmappy.tests.film_strip_support).
# tests/test_suite_collection.py guards all of it
consider_namespace_packages = false
pythonpath = ["."]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Directory *name* patterns pytest will not recurse into, matched at any depth. Do not
# list "examples": it once matched a tests/examples/ and silently skipped those tests.
# (The top-level examples/ directory is already outside testpaths.)
norecursedirs = [
  "build",
  "dist",
  "*.egg-info",
  ".git",
  ".hypothesis",
  "__pycache__",
]
addopts = "--import-mode=importlib -n auto --cov=glitchygames --cov=mr_muncher --cov=brave_adventurer_core --cov=brave_adventurer --cov=brave_adventurer_papyrus --cov=brave_adventurer_modes --cov=clockwork_keep --cov=paddleslap --cov=drawing_fire --cov=dt_demo --cov=joystick_demo --cov=text_input_demo --cov=bitmappy --cov-fail-under=100 --log-cli-level=DEBUG --junitxml=test-results/junit.xml"
filterwarnings = [
  "error",
  # Third-party: speechrecognition depends on aifc, removed from stdlib in 3.13
  "ignore:aifc was removed:DeprecationWarning",
  # Third-party: docstring_parser uses deprecated ast nodes (via aisuite)
  "ignore:ast\\..* is deprecated:DeprecationWarning",
  # pytest-benchmark warns when xdist is active (benchmarks auto-disabled)
  "ignore:Benchmarks are automatically disabled:pytest_benchmark.logger.PytestBenchmarkWarning",
]
# Note: All tests run with no_unhandled_events=True to catch unhandled events as bugs

[tool.coverage.run]
source = [
  "glitchygames",
  "mr_muncher",
  "brave_adventurer_core",
  "brave_adventurer",
  "brave_adventurer_papyrus",
  "brave_adventurer_modes",
  "clockwork_keep",
  "paddleslap",
  "drawing_fire",
  "dt_demo",
  "joystick_demo",
  "text_input_demo",
  "bitmappy",
]
branch = true
parallel = true
omit = [
  "*/tests/*",
  "*/build/*",
  "*/dist/*",
  "*/__pycache__/*",
  "*/migrations/*",
]

[tool.coverage.paths]
# The imported copy (nox: site-packages, not editable; uv sync: src/ itself) is reported as the
# repository's src/glitchygames, so the report and its 100% gate name the files in git
glitchygames = ["src/glitchygames", "*/site-packages/glitchygames"]
mr_muncher = [
  "src/games/mr-muncher/src/mr_muncher",
  "*/site-packages/mr_muncher",
]
brave_adventurer_core = [
  "src/games/brave-adventurer/src/brave_adventurer_core",
  "*/site-packages/brave_adventurer_core",
]
brave_adventurer = [
  "src/games/brave-adventurer/src/brave_adventurer",
  "*/site-packages/brave_adventurer",
]
brave_adventurer_papyrus = [
  "src/games/brave-adventurer/src/brave_adventurer_papyrus",
  "*/site-packages/brave_adventurer_papyrus",
]
brave_adventurer_modes = [
  "src/games/brave-adventurer/src/brave_adventurer_modes",
  "*/site-packages/brave_adventurer_modes",
]
clockwork_keep = [
  "src/games/clockwork-keep/src/clockwork_keep",
  "*/site-packages/clockwork_keep",
]
paddleslap = [
  "src/games/paddleslap/src/paddleslap",
  "*/site-packages/paddleslap",
]
drawing_fire = [
  "src/games/drawing-fire/src/drawing_fire",
  "*/site-packages/drawing_fire",
]
dt_demo = ["src/demos/dt-demo/src/dt_demo", "*/site-packages/dt_demo"]
joystick_demo = [
  "src/demos/joystick-demo/src/joystick_demo",
  "*/site-packages/joystick_demo",
]
text_input_demo = [
  "src/demos/text-input-demo/src/text_input_demo",
  "*/site-packages/text_input_demo",
]
bitmappy = ["src/apps/bitmappy/src/bitmappy", "*/site-packages/bitmappy"]

[tool.coverage.report]
show_missing = true
# fail_under compares the total rounded to this many digits: at 0 (the default) a 98.71% total
# passed the 99% gate (2026-10-22)
precision = 2

exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if self.debug:",
  "if settings.DEBUG",
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == .__main__.:",
  "class .*\\bProtocol\\):",
  "@(abc\\.)?abstractmethod",
  "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
preview = true
line-length = 100
output-format = "grouped"
src = [
  "src",
  "tests",
  "scripts",
  "src/games/mr-muncher/src",
  "src/games/brave-adventurer/src",
  "src/games/clockwork-keep/src",
  "src/games/paddleslap/src",
  "src/games/drawing-fire/src",
  "src/demos/dt-demo/src",
  "src/demos/joystick-demo/src",
  "src/demos/text-input-demo/src",
  "src/apps/bitmappy/src",
  "src/apps/bitmappy/tests",
]
include = [
  "src/glitchygames/*.py",
  "src/games/mr-muncher/**/*.py",
  "src/games/brave-adventurer/**/*.py",
  "src/games/clockwork-keep/**/*.py",
  "src/games/paddleslap/**/*.py",
  "src/games/drawing-fire/**/*.py",
  "src/demos/dt-demo/**/*.py",
  "src/demos/joystick-demo/**/*.py",
  "src/demos/text-input-demo/**/*.py",
  "src/apps/bitmappy/**/*.py",
  "tests/**/*.py",
  "scripts/**/*.py",
  "noxfile.py",
]
target-version = "py314"
# A workspace member's tests directory is not a package (pytest imports its files by name; a
# package named tests would shadow the engine's tests/), so it is a namespace on purpose
namespace-packages = [
  "src/games/mr-muncher/tests",
  "src/games/brave-adventurer/tests",
  "src/games/clockwork-keep/tests",
  "src/games/paddleslap/tests",
  "src/games/drawing-fire/tests",
  "src/demos/dt-demo/tests",
  "src/demos/joystick-demo/tests",
  "src/demos/text-input-demo/tests",
  "src/apps/bitmappy/tests",
]

[tool.ruff.lint]
task-tags = ["HACK", "TODO", "FIXME", "XXX", "NOTE", "BUG", "OPTIMIZE", "WIP"]
select = ["ALL"]
ignore = [
  # --- Previously ignored ---
  "COM812",  # Missing trailing comma (conflicts with ruff format, which places them itself)
  "SLF001",  # Private member accessed (Needed for some annotations, like argparse._ArgumentGroup)
  "ISC002",  # Use of implicit string concatenation (this conflicts with ruff format)
  "CPY001",  # Missing copyright notice at top of file
  "ISC001",  # Use of implicit string concatenation (this conflicts with ruff format)
  "D203",    # Incorrect blank line before class (conflicts with D211)
  "D213",    # Multi-line summary second line (conflicts with D212)
  "PLC0415", # import-outside-top-level (intentional: circular imports, optional deps, platform-specific)
  "S101",    # assert is used intentionally for type narrowing and runtime invariant checks
  "PLR6301", # Method could be a function/staticmethod
  # --- Added with ruff 0.17 ---
  # Preview rule (name only, no code). The suite uses autouse fixtures deliberately,
  # e.g. conftest's singleton reset and pygame mocks must apply to every test.
  "pytest-fixture-autouse",
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "PLR2004",
  "ANN",
  "ARG001",
  "ARG005",
  "PLC2701",
  "PLC2801", # Tests may call dunder methods directly to verify they work
  "D102",    # Test method names are self-documenting
  "DOC201",  # Test helper return docs unnecessary
  "RET504",  # Explicit assignment before return aids test readability
  "F841",
  "B007",
  "S101",
  "PT018",   # Compound assertions are acceptable in tests
  "RUF069",  # Exact float comparisons are intentional in property-based tests
  "B905",    # zip() without strict= is fine in tests
  "B002",    # False positive on double-negation test: -(-speed)
  "ARG002",  # Pytest fixtures are activated by parameter presence, not by direct use
  "S311",    # Tests build seeded random.Random instances for reproducible inputs
]
# Workspace members' tests get the same relaxations as tests/ (one glob per layer)
"src/games/*/tests/**/*.py" = [
  "PLR2004",
  "ANN",
  "ARG001",
  "ARG005",
  "PLC2701",
  "PLC2801", # Tests may call dunder methods directly to verify they work
  "D102",    # Test method names are self-documenting
  "DOC201",  # Test helper return docs unnecessary
  "RET504",  # Explicit assignment before return aids test readability
  "F841",
  "B007",
  "S101",
  "PT018",   # Compound assertions are acceptable in tests
  "RUF069",  # Exact float comparisons are intentional in property-based tests
  "B905",    # zip() without strict= is fine in tests
  "B002",    # False positive on double-negation test: -(-speed)
  "ARG002",  # Pytest fixtures are activated by parameter presence, not by direct use
  "S311",    # Tests build seeded random.Random instances for reproducible inputs
]
"src/demos/*/tests/**/*.py" = [
  "PLR2004",
  "ANN",
  "ARG001",
  "ARG005",
  "PLC2701",
  "PLC2801", # Tests may call dunder methods directly to verify they work
  "D102",    # Test method names are self-documenting
  "DOC201",  # Test helper return docs unnecessary
  "RET504",  # Explicit assignment before return aids test readability
  "F841",
  "B007",
  "S101",
  "PT018",   # Compound assertions are acceptable in tests
  "RUF069",  # Exact float comparisons are intentional in property-based tests
  "B905",    # zip() without strict= is fine in tests
  "B002",    # False positive on double-negation test: -(-speed)
  "ARG002",  # Pytest fixtures are activated by parameter presence, not by direct use
  "S311",    # Tests build seeded random.Random instances for reproducible inputs
]
"src/apps/*/tests/**/*.py" = [
  "PLR2004",
  "ANN",
  "ARG001",
  "ARG005",
  "PLC2701",
  "PLC2801", # Tests may call dunder methods directly to verify they work
  "D102",    # Test method names are self-documenting
  "DOC201",  # Test helper return docs unnecessary
  "RET504",  # Explicit assignment before return aids test readability
  "F841",
  "B007",
  "S101",
  "PT018",   # Compound assertions are acceptable in tests
  "RUF069",  # Exact float comparisons are intentional in property-based tests
  "B905",    # zip() without strict= is fine in tests
  "B002",    # False positive on double-negation test: -(-speed)
  "ARG002",  # Pytest fixtures are activated by parameter presence, not by direct use
  "S311",    # Tests build seeded random.Random instances for reproducible inputs
]
"src/glitchygames/events/base.py" = [
  "ANN401", # HashableEvent.__getattr__ returns Any: custom and unknown events' fields (pygame's own Event.__getattr__ is Any); the per-type classes declare theirs
]
"src/glitchygames/randomness.py" = [
  "S311", # The engine's seeded random streams are deliberately non-cryptographic (replayable)
]
"src/glitchygames/api/**/*.py" = [
  "RUF029", # FastAPI requires async def for route handlers even without await
]
"scripts/**/*.py" = [
  "TC003", # Scripts use stdlib imports at runtime, not just for type checking
]
"src/glitchygames/effects/easing.py" = [
  "DOC201",  # Easing functions are pure math; return type is obvious (float)
  "PLR2004", # Mathematical constants (0.5 midpoint, Penner coefficients) are standard
  "RUF069",  # Float equality (t == 0.0, t == 1.0) is intentional for Penner boundary conditions
]
"src/glitchygames/effects/tween.py" = [
  "PLR0913", # Tween.__init__ needs many parameters (target, property, start, end, duration, easing, etc.)
  "PLR0917", # Same as above -- many positional args are the natural API
]
"src/glitchygames/camera.py" = [
  "PLR0913", # Camera2D and ParallaxLayer constructors need many configuration params
]
"src/glitchygames/physics/body.py" = [
  "PLR0913", # PhysicsBody preset factory methods need many configuration params
  "PLR0917", # Same -- many positional args are the natural preset API
]
"src/glitchygames/animation/expressions.py" = [
  "DOC501",  # Expression parser raises ValueError by design; documenting every one is noise
  "PLR2004", # Token count checks use literal numbers (standard parser code)
  "S105",    # 'token' variable name triggers false positive for hardcoded password
  "ERA001",  # Comment about Phase 2 grammar looks like commented-out code
  "FBT001",  # LiteralExpr takes bool as positional (it's a value, not a flag)
]
"src/glitchygames/ui/menus.py" = [
  "PLR0913", # Menu constructors need geometry + identity + container params
]
"src/glitchygames/ui/text_widgets.py" = [
  "PLR0913", # Text widget constructors need geometry + font + style params
]
"src/glitchygames/ui/buttons.py" = [
  "PLR0913", # Button constructors need geometry + identity + callback params
]
"src/glitchygames/ui/inputs.py" = [
  "PLR0913", # Input/dialog constructors need geometry + callbacks + options params
]
"src/glitchygames/ui/sliders.py" = [
  "PLR0913", # Slider/color constructors need geometry + range + parent params
]
"src/glitchygames/ui/dialogs.py" = [
  "PLR0913", # Dialog constructors need scene, callbacks, options, and group params
]
"src/glitchygames/scenes/scene.py" = [
  "PLR0904", # Scene base class provides one handler method per pygame event type
]
"src/glitchygames/game_objects/ball.py" = [
  "PLR0913", # BallSprite constructor needs physics, speed, collision, and display params
]
"src/glitchygames/game_objects/paddle.py" = [
  "PLR0913", # Paddle constructors need geometry, speed, color, collision params
]
"src/games/paddleslap/src/paddleslap/__init__.py" = [
  "PLR0913", # Game helper functions need ball geometry and physics params
  # The game is one module: its recordings name games.paddleslap:Game, so Game stays defined in
  # the package itself (docs/architecture/game_packages.md, "A game that is one module")
  "RUF067",
]
"src/demos/dt-demo/src/dt_demo/__init__.py" = [
  # The demo is one module: its logical name is demos.dt_demo:Game, so Game stays defined in the
  # package itself (docs/architecture/game_packages.md, "A game that is one module")
  "RUF067",
]
"src/demos/joystick-demo/src/joystick_demo/__init__.py" = [
  # The demo is one module: its logical name is demos.joystick_demo:Game, so Game stays defined
  # in the package itself (docs/architecture/game_packages.md, "A game that is one module")
  "RUF067",
]
"src/demos/text-input-demo/src/text_input_demo/__init__.py" = [
  # The demo is one module: its logical name is demos.text_input_demo:Game, so Game stays defined
  # in the package itself (docs/architecture/game_packages.md, "A game that is one module")
  "RUF067",
]
"src/glitchygames/services/sprite_generation_service.py" = [
  "PLR0913", # Sprite generation needs provider, model, prompt, and dimension params
]

[tool.ruff.format]
docstring-code-format = true
quote-style = "single"
line-ending = "lf"

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
ignore-fully-untyped = false

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"
multiline-quotes = "double"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = [
  "glitchygames",
  "mr_muncher",
  "brave_adventurer_core",
  "brave_adventurer",
  "brave_adventurer_papyrus",
  "brave_adventurer_modes",
  "clockwork_keep",
  "paddleslap",
  "drawing_fire",
  "dt_demo",
  "joystick_demo",
  "text_input_demo",
  "bitmappy",
]

## basedpyright config lives in pyrightconfig.json (supports per-environment overrides)

## ty (Astral's type checker) configuration
[tool.ty.environment]
python-version = "3.14"
# src/ first: the engine's source package (explicit; ty's automatic src root is not relied on)
root = [
  "src",
  ".",
  "src/games/mr-muncher/src",
  "src/games/brave-adventurer/src",
  "src/games/clockwork-keep/src",
  "src/games/paddleslap/src",
  "src/games/drawing-fire/src",
  "src/demos/dt-demo/src",
  "src/demos/joystick-demo/src",
  "src/demos/text-input-demo/src",
  "src/apps/bitmappy/src",
]
extra-paths = ["scripts"]

[tool.ty.src]
include = [
  "src/glitchygames",
  "src/games/mr-muncher",
  "src/games/brave-adventurer",
  "src/games/clockwork-keep",
  "src/games/paddleslap",
  "src/games/drawing-fire",
  "src/demos/dt-demo",
  "src/demos/joystick-demo",
  "src/demos/text-input-demo",
  "src/apps/bitmappy",
  "scripts",
]
# Tests excluded: ty doesn't understand pytest-mock's mocker.patch semantics,
# generating hundreds of false positives on mock attribute access and assignments.
exclude = [
  "tests",
  "src/games/*/tests",
  "src/demos/*/tests",
  "src/apps/*/tests",
  ".venv",
  ".nox",
]

[tool.ty.rules]
# type: ignore comments are shared with basedpyright — don't flag them as unused
unused-type-ignore-comment = "ignore"

[tool.ty.terminal]
output-format = "full"
error-on-warning = false


[tool.bandit]
exclude_dirs = ["tests", "src/glitchygames/tests"]
# Filter to Medium+ severity and confidence to reduce noise.
# B101 (assert_used) is Low severity and gets filtered out by this.
# TODO: Replace remaining assert usage with explicit raises, then tighten to low/low
severity = "medium"
confidence = "medium"

[tool.deptry]
# Not this package's code: the pygame-ce submodule (its own project), browser/, which runs
# in Pyodide on its runtime modules (js, pyodide) and its own files, and the workspace members
# under src/games, src/demos and src/apps (projects of their own, each declaring its dependencies:
# tests/test_workspace_config.py, test_every_member_declares_what_it_imports)
extend_exclude = [
  "third_party",
  "browser",
  "src/games",
  "src/demos",
  "src/apps",
]
# The engine's own package, under src/ (deptry guesses first-party modules from the root's direct
# children only). The members' packages are not first party: the root's extras (games, demos,
# apps) declare their distributions, and scripts/ imports the games, which deptry ties together
# through package_module_name_map
known_first_party = ["glitchygames"]

# pygame-ce installs as the 'pygame' module; each workspace member as its import packages (its
# editable install records a .pth file, not its packages, so deptry cannot read them; kept equal to
# the workspace by tests/test_workspace_config.py)
[tool.deptry.package_module_name_map]
"pygame-ce" = "pygame"
"mr-muncher" = ["mr_muncher"]
"brave-adventurer" = [
  "brave_adventurer_core",
  "brave_adventurer",
  "brave_adventurer_papyrus",
  "brave_adventurer_modes",
]
"clockwork-keep" = ["clockwork_keep"]
"paddleslap" = ["paddleslap"]
"drawing-fire" = ["drawing_fire"]
"dt-demo" = ["dt_demo"]
"joystick-demo" = ["joystick_demo"]
"text-input-demo" = ["text_input_demo"]
"bitmappy" = ["bitmappy"]

[tool.deptry.per_rule_ignores]
# numpy is used indirectly via pygame.surfarray (array3d/array4d) which requires it at runtime
# Dev/build/lint/docs tools are invoked via CLI, not imported in Python code
# bokeh is kept deliberately for future plotting tools (the user, 2026-10-22); nothing imports it yet
# The demos layer's members are in the root's `demos` extra, but nothing deptry scans imports them
# (scripts/ imports the games, not the demos; a demo's tests are its member's, under src/demos)
DEP002 = [
  "dt-demo",
  "joystick-demo",
  "text-input-demo",
  "numpy",
  "bokeh",
  "deptry",
  "mkdocs",
  "mkdocstrings",
  "mkdocs-material",
  "mkdocs-literate-nav",
  "mkdocs-section-index",
  "pymdown-extensions",
  "mkdocs-autorefs",
  "mkdocs-macros-plugin",
  "mkdocstrings-python",
  "pytest-cov",
  "pytest-xdist",
  "pytest-benchmark",
  "pytest-mock",
  "bandit",
  "ruff",
  "pre-commit",
  "basedpyright",
  "ty",
  "pyinstaller",
  "vulture",
  "hypothesis",
  "taplo",
  "yamllint",
  "wily",
  "radon",
]

[tool.uv]
# aisuite pins docstring-parser<0.16, but 0.16+ is needed for Python 3.14
# (ast.NameConstant removed). Override until aisuite loosens the pin.
override-dependencies = ["docstring-parser>=0.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
