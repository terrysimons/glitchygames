# Ansible's settings for the playbooks in ansible/, read when Ansible runs from this directory
# (the repository's root), as their instructions say to.
[defaults]
# Each task's results printed in the hosts' natural order (4gb, 8gb, 16gb), not as each host
# finishes: ansible/callback_plugins/natural_order.py
stdout_callback = natural_order
callback_plugins = ansible/callback_plugins
