[project]
name = "sound-board-demo"
version = "1.0.0"
description = "Sound Board Demo: hear every built-in wave and noise, built on GlitchyGames"
requires-python = ">=3.14,<4.0"
# What the demo imports: the engine and pygame-ce (decision 10: a member declares its imports)
dependencies = ["glitchygames>=1.0.0", "pygame-ce"]

[project.scripts]
sound-board-demo = "sound_board_demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sound_board_demo"]

[tool.uv.sources]
glitchygames = { workspace = true }
