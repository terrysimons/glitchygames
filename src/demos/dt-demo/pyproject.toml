[project]
name = "dt-demo"
version = "1.0.0"
description = "Delta Time Demo: frame-rate-independent movement, built on GlitchyGames"
requires-python = ">=3.14,<4.0"
# What the demo imports: the engine and pygame-ce (decision 10: a member declares its imports)
dependencies = ["glitchygames", "pygame-ce"]

[project.scripts]
dt-demo = "dt_demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dt_demo"]

[tool.uv.sources]
glitchygames = { workspace = true }
