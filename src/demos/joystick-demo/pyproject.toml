[project]
name = "joystick-demo"
version = "1.0.0"
description = "Joystick Demo: every connected joystick and game controller, live"
requires-python = ">=3.14,<4.0"
# What the demo imports: the engine and pygame-ce (decision 10: a member declares its imports)
dependencies = ["glitchygames>=1.0.0", "pygame-ce"]

[project.scripts]
joystick-demo = "joystick_demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/joystick_demo"]

[tool.uv.sources]
glitchygames = { workspace = true }
