[project]
name = "bitmappy"
version = "1.0.0"
description = "Bitmappy: the GlitchyGames pixel-art and animation editor, with AI sprite generation"
requires-python = ">=3.14,<4.0"
# What Bitmappy imports: the engine, aisuite (AI sprite generation; the root's exact extras pin,
# whose comment says why `google` is left out), numpy (pygame.surfarray), pydantic (its AI
# request and response models), pygame-ce, and tenacity (the AI worker's retries)
dependencies = [
  "glitchygames",
  "aisuite[anthropic,aws,cerebras,cohere,deepgram,deepseek,gemini,groq,lmstudio,mcp,mistral,ollama,openai,postgres,watsonx]>=0.1.14",
  "numpy",
  "pydantic",
  "pygame-ce",
  "tenacity>=9.1",
]

[project.scripts]
bitmappy = "bitmappy:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bitmappy"]

[tool.uv.sources]
glitchygames = { workspace = true }
