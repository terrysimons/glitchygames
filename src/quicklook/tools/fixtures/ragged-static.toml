# Hand-written fixture: ragged rows in a static sprite. The one pixel-row rule
# (normalize_pixel_rows) pads with transparent pixels; it used to pad with the most common glyph
[sprite]
name = "ragged_static"
pixels = """
  ab
abbbb
b
"""

[colors."a"]
red = 200
green = 10
blue = 10

[colors."b"]
red = 10
green = 200
blue = 10
