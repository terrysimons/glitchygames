# Hand-written fixture: ragged rows in an animated frame, plus a glyph missing from [colors]. The
# one pixel-row rule (normalize_pixel_rows) keeps the first row's unshared indentation, widens to
# the longest row and pads with transparent pixels; it used to cut to the most common length
[[animation]]
namespace = "wobble"
frame_interval = 1

[[animation.frame]]
frame_index = 1
pixels = """
  abc
abc
ab
abcab
abq
"""

[[animation.frame]]
frame_index = 0
frame_interval = 0.25
pixels = """
ccc
cac
"""

[colors."a"]
red = 200
green = 10
blue = 10

[colors."b"]
red = 10
green = 200
blue = 10
alpha = 128

[colors."c"]
red = 255
green = 0
blue = 255
