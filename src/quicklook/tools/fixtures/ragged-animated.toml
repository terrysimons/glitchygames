# Hand-written fixture: ragged rows in an animated frame (R4: per-line strip, most common length,
# truncate, pad with the line's own last glyph), plus a glyph missing from [colors]
[[animation]]
namespace = "wobble"
frame_interval = 1

[[animation.frame]]
frame_index = 1
pixels = """
  abc
abc
ab
abcab
abq
"""

[[animation.frame]]
frame_index = 0
frame_interval = 0.25
pixels = """
ccc
cac
"""

[colors."a"]
red = 200
green = 10
blue = 10

[colors."b"]
red = 10
green = 200
blue = 10
alpha = 128

[colors."c"]
red = 255
green = 0
blue = 255
