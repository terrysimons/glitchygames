# XcodeGen spec for the sprite QuickLook host app and its extensions
# (docs/specs/2026-10-29-sprite-quicklook-design.md). Generate with `make project`; the generated
# SpritePreview.xcodeproj is not checked in.
name: SpritePreview
options:
  bundleIdPrefix: games.glitchy
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  SpriteCore:
    path: ..
settings:
  base:
    # No signing identity on this Mac: sign ad hoc ("Sign to Run Locally")
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"
targets:
  SpritePreview:
    type: application
    platform: macOS
    sources: [HostApp]
    info:
      path: HostApp/Info.plist
      properties:
        CFBundleDisplayName: GlitchyGames Sprite Preview
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: GlitchyGames
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: games.glitchy.SpritePreview
        # The name Finder, the Dock and System Settings show (the owner, 2026-10-29); the
        # bundle identifiers keep the short name
        PRODUCT_NAME: GlitchyGames Sprite Preview
        # shroom4.toml drawn by tools/make_app_icon.py (the owner, 2026-10-29)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: SpritePreviewExtension
        embed: true
        codeSign: true
      - target: SpriteThumbnailExtension
        embed: true
        codeSign: true
  SpritePreviewExtension:
    type: app-extension
    platform: macOS
    sources: [PreviewExtension]
    info:
      path: PreviewExtension/Info.plist
      properties:
        CFBundleDisplayName: GlitchyGames Sprite Preview
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLIsDataBasedPreview: false
            QLSupportedContentTypes: [public.toml]
            QLSupportsSearchableItems: false
    entitlements:
      path: PreviewExtension/PreviewExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: games.glitchy.SpritePreview.PreviewExtension
    dependencies:
      - package: SpriteCore
  SpriteThumbnailExtension:
    type: app-extension
    platform: macOS
    sources: [ThumbnailExtension]
    info:
      path: ThumbnailExtension/Info.plist
      properties:
        CFBundleDisplayName: GlitchyGames Sprite Thumbnails
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ThumbnailProvider
          NSExtensionAttributes:
            QLSupportedContentTypes: [public.toml]
            QLThumbnailMinimumDimension: 0
    entitlements:
      path: ThumbnailExtension/ThumbnailExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: games.glitchy.SpritePreview.ThumbnailExtension
    dependencies:
      - package: SpriteCore
