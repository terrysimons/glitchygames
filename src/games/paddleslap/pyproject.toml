[project]
name = "paddleslap"
version = "1.0.0"
description = "PaddleSlap: a two-paddle ball game, built on GlitchyGames"
requires-python = ">=3.14,<4.0"
dependencies = ["glitchygames"]

[project.scripts]
paddleslap = "paddleslap:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paddleslap"]

[tool.uv.sources]
glitchygames = { workspace = true }
