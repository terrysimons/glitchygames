[project]
name = "paddleslap"
version = "1.0.0"
description = "PaddleSlap: a two-paddle ball game, built on GlitchyGames"
requires-python = ">=3.14,<4.0"
# What it imports (decision 10: a member declares every distribution it imports)
dependencies = ["glitchygames>=1.0.0", "pygame-ce"]

[project.scripts]
paddleslap = "paddleslap:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paddleslap"]

[tool.uv.sources]
glitchygames = { workspace = true }
