[project]
name = "clockwork-keep"
version = "1.0.0"
description = "Clockwork Keep: a steampunk tower climb, built on GlitchyGames"
requires-python = ">=3.14,<4.0"
# What it imports (decision 10: a member declares every distribution it imports)
dependencies = ["glitchygames>=1.0.0", "pydantic", "pygame-ce"]

[project.scripts]
clockwork-keep = "clockwork_keep:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clockwork_keep"]

[tool.uv.sources]
glitchygames = { workspace = true }
