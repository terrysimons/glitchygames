[project]
name = "clockwork-keep"
version = "1.0.0"
description = "Clockwork Keep: a steampunk tower climb, built on GlitchyGames"
requires-python = ">=3.14,<4.0"
dependencies = ["glitchygames"]

[project.scripts]
clockwork-keep = "clockwork_keep:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clockwork_keep"]

[tool.uv.sources]
glitchygames = { workspace = true }
