[project]
name = "zombies-aint-my-neighbors"
version = "1.0.0"
description = "Zombies Ain't My Neighbors: a 4-player creature-feature run-and-gun, built on GlitchyGames"
requires-python = ">=3.14,<4.0"
# What it imports (decision 10: a member declares every distribution it imports)
dependencies = ["glitchygames>=1.0.0", "pydantic", "pygame-ce"]

[project.scripts]
zombies-aint-my-neighbors = "zombies_aint_my_neighbors:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zombies_aint_my_neighbors"]

[tool.uv.sources]
glitchygames = { workspace = true }
