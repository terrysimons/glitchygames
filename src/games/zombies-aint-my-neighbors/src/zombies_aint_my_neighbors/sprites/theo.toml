[[transition]]
from = "shoot_down"
to = "idle_down"
when = "animation_complete"

[[transition]]
from = "shoot_up"
to = "idle_up"
when = "animation_complete"

[[transition]]
from = "shoot_left"
to = "idle_left"
when = "animation_complete"

[[transition]]
from = "launch_down"
to = "idle_down"
when = "animation_complete"

[[transition]]
from = "launch_up"
to = "idle_up"
when = "animation_complete"

[[transition]]
from = "launch_left"
to = "idle_left"
when = "animation_complete"

[[transition]]
from = "throw_down"
to = "idle_down"
when = "animation_complete"

[[transition]]
from = "throw_up"
to = "idle_up"
when = "animation_complete"

[[transition]]
from = "throw_left"
to = "idle_left"
when = "animation_complete"

[[transition]]
from = "knocked-out"
to = "respawn"
when = "animation_complete and lives_left > 0"

[[transition]]
from = "respawn"
to = "idle_down"
when = "animation_complete"

[[transition]]
from = "rescue"
to = "idle_down"
when = "animation_complete"
