[project]
name = "drawing-fire"
version = "1.0.0"
description = "Drawing Fire: a pencil-on-paper stick-figure battle, built on GlitchyGames"
requires-python = ">=3.14,<4.0"
# What it imports (decision 10: a member declares every distribution it imports)
dependencies = ["glitchygames>=1.0.0", "pygame-ce"]

[project.scripts]
drawing-fire = "drawing_fire:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drawing_fire"]

[tool.uv.sources]
glitchygames = { workspace = true }
